<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Unified Benefits Hub — a cohort-driven rewards experience that recomposes itself around what matters to each user right now.">
<meta name="color-scheme" content="light">
<!-- Standalone build. Generated from index.html (the artifact source, which is
     published without a document wrapper). Open this file directly in a browser. -->
<title>Benefits Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* ==========================================================================
   DESIGN TOKENS
   Black ground, white cards, near-black type. Red is a brand/urgency accent
   only; blue is reserved for links and selected detail. Nothing below this
   block hardcodes a colour, radius, space or shadow.
   ========================================================================== */
:root{
  color-scheme:light;

  /* colour */
  --bg:#F5F5F5;
  --bg-2:#EEF0F2;
  --card:#FFFFFF;
  --surface:#F5F5F5;
  --surface-muted:#EEF1F4;
  --text:#171717;
  --text-2:#60666D;
  --text-3:#8A8F94;
  --border:#D9DDE1;
  --border-soft:#E8EBEE;
  --red:#E51B23;
  --red-soft:#FDEAEB;
  --blue:#1677FF;
  --blue-soft:#EAF2FF;
  --green:#19A463;
  --green-soft:#E6F6EE;
  --amber-soft:#FFF4E0;
  --amber-ink:#9A6300;
  --gold:#C79141;
  --gold-soft:#E7C68C;

  /* on the page ground */
  --on-bg:#171717;
  --on-bg-2:#60666D;
  --on-bg-3:#8A8F94;
  --hairline:rgba(23,23,23,.14);
  --hairline-2:rgba(23,23,23,.08);

  /* type */
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-display:1.75rem;  --t-display-lh:1.08;
  --t-price:1.65rem;
  --t-title:1.0625rem;
  --t-body:.875rem;
  --t-meta:.75rem;
  --t-label:.75rem;

  /* space */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s7:28px; --s8:32px; --s10:40px; --s12:48px;

  /* radius */
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:30px; --r-pill:999px;

  /* elevation */
  --sh-sm:0 1px 2px rgba(16,24,40,.06);
  --sh-card:0 4px 18px rgba(0,0,0,.08);
  --sh-float:0 10px 28px rgba(0,0,0,.16);
  --sh-lift:0 14px 34px rgba(0,0,0,.22);

  --gut:var(--s4);
  --desk:#E7EAED;
  --chrome:#0B0908;
  --chrome-ink:#F2E8E4;
  --chrome-ink-2:#8B8F94;
  --chrome-line:#26262A;
  --chrome-field:#1A1A1C;

  /* Insider keeps its own brand world */
  --ins-1:#B4123F; --ins-2:#7C0A2B; --ins-cream:#F8E4BC;
  --ins-ink:#FBEFE4; --ins-dim:rgba(251,239,228,.7); --ins-line:rgba(255,255,255,.16);
}

/* ============================== BASE ============================== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--on-bg);font-family:var(--f);
  font-size:var(--t-body);line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
h1,h2,h3{text-wrap:balance;letter-spacing:-.03em;line-height:var(--t-display-lh);font-weight:700}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img,svg{max-width:100%}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono,.rupee,.expiry,.led__v,.act__v,.act__s,.task__r,.got__v,.ins__lvl,.statusbar,.receipt__s,
.meter__row,.ring__n,.hero__amount,.prem__v,.xcard__v,.scratch__amt,.plan__price,
.eyebrow,.hero__ledger-h,.chrome__label{font-variant-numeric:tabular-nums}

/* section label — the small uppercase heading that sets the page rhythm */
.eyebrow,.sec__title{font-size:var(--t-label);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.eyebrow{color:var(--on-bg-3)}
.eyebrow--ember{color:var(--red)}

/* ===================== PROTOTYPE CHROME / DEVICE ===================== */
.stage{display:block}
.device{position:relative;background:var(--bg)}
.screen{container-type:inline-size}
.statusbar,.homebar{display:none}

.chrome{position:sticky;top:0;z-index:60;background:var(--chrome);color:var(--chrome-ink);
  border-bottom:1px solid var(--chrome-line)}
.chrome__in{padding:9px var(--s4);display:flex;align-items:center;gap:var(--s3)}
.chrome__label{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  color:var(--chrome-ink-2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.chrome__dot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(229,27,35,.22);flex:none}
.chrome__field{position:relative;display:flex;align-items:center;flex:1;min-width:0}
.chrome__field svg{position:absolute;right:11px;pointer-events:none;color:var(--chrome-ink-2)}
.chrome select{appearance:none;width:100%;background:var(--chrome-field);color:var(--chrome-ink);
  border:1px solid var(--chrome-line);border-radius:var(--r-pill);padding:7px 30px 7px 13px;
  font-size:12.5px;font-weight:600;min-height:36px;text-overflow:ellipsis}
.chrome__note,.chrome__hints,.chrome__cap{display:none}

@media (min-width:900px){
  body{background:var(--desk)}
  .stage{display:flex;align-items:flex-start;justify-content:center;gap:clamp(28px,5vw,64px);
    padding:44px 32px 56px;min-height:100vh}
  .chrome{position:sticky;top:44px;width:296px;flex:none;background:none;border:0;color:var(--on-bg);z-index:1}
  .chrome__in{display:block;padding:0}
  .chrome__label{color:var(--on-bg-3);margin-bottom:var(--s4);font-size:10px}
  .chrome__field{display:block}
  .chrome__field svg{color:var(--text-3);top:50%;margin-top:-6px}
  .chrome select{background:var(--card);color:var(--text);border-color:var(--border);
    border-radius:var(--r-md);padding:11px 34px 11px 14px;font-size:14px;min-height:46px;box-shadow:var(--sh-sm)}
  .chrome__note{display:block;margin-top:var(--s3);font-size:13px;line-height:1.55;color:var(--on-bg-2)}
  .chrome__note b{color:var(--on-bg);font-weight:700}
  .chrome__hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s4);padding-top:var(--s4);
    border-top:1px solid var(--hairline)}
  .chrome__hints span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
    color:var(--on-bg-3);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:4px 9px}
  .chrome__cap{display:block;margin-top:var(--s3);font-size:11.5px;color:var(--on-bg-3);line-height:1.5}

  .device{width:375px;flex:none;display:flex;flex-direction:column;overflow:hidden;
    height:min(812px,calc(100vh - 108px));border-radius:44px;border:9px solid #1A1B1E;
    box-shadow:0 40px 80px -34px rgba(16,24,40,.55),0 0 0 1px rgba(16,24,40,.12)}
  .screen{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:11px 24px 5px;
    font-size:12px;font-weight:600;color:var(--text);background:var(--bg);flex:none}
  .statusbar__r{display:flex;align-items:center;gap:5px}
  .batt{width:20px;height:10px;border:1.4px solid var(--text);border-radius:3px;position:relative;opacity:.85}
  .batt::before{content:"";position:absolute;inset:1.5px;right:6px;background:var(--text);border-radius:1px}
  .batt::after{content:"";position:absolute;right:-3.4px;top:3px;width:2px;height:4px;background:var(--text);border-radius:0 1px 1px 0}
  .homebar{display:block;flex:none;padding:7px 0 9px;background:var(--card)}
  .homebar i{display:block;width:128px;height:5px;border-radius:3px;background:var(--text);opacity:.3;margin:0 auto}
  .toasts{position:absolute;left:14px;right:14px;bottom:22px;width:auto;max-width:none;transform:none}
}

/* ===================== DESIGN RATIONALE (prototype chrome) ===================== */
.rat{display:none}
@media (min-width:1180px){
  .rat{display:block;width:296px;flex:none;position:sticky;top:44px}
  .rat__h{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--on-bg-3);
    display:flex;align-items:center;gap:7px}
  .rat__h i{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:none}
  .rat__s{font-size:12.5px;color:var(--on-bg-2);line-height:1.5;margin-top:10px}
  .rat__l{display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s5)}
  .rat__i{padding-left:var(--s3);border-left:2px solid var(--border)}
  .rat__t{font-size:12.5px;font-weight:700;color:var(--on-bg);letter-spacing:-.01em}
  .rat__d{font-size:12px;color:var(--on-bg-2);line-height:1.55;margin-top:4px}
  .rat__f{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--border);
    font-size:11.5px;color:var(--on-bg-3);line-height:1.5}
}

/* ========================= TOP NAVIGATION ========================= */
.head{position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid transparent;transition:border-color .2s}
.head.is-stuck{border-bottom-color:var(--border)}
.head__in{padding:var(--s3) var(--gut);display:flex;align-items:center;gap:var(--s2)}
.brand{display:flex;align-items:center;font-weight:700;letter-spacing:-.025em;font-size:18px;color:var(--on-bg)}
.head__acts{margin-left:auto;display:flex;align-items:center;gap:var(--s4)}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--on-bg-2)}
.hdrbtn{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;
  transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.hdrbtn:hover{transform:translateY(-1px)}
.hdrbtn:active{transform:translateY(0) scale(.96)}
.hdrbtn__c{position:relative;width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;
  background:var(--card);box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-sm);transition:box-shadow .18s}
.hdrbtn:hover .hdrbtn__c{box-shadow:inset 0 0 0 1px var(--border),var(--sh-card)}
.hdrbtn__l{font-size:9.5px;font-weight:600;letter-spacing:-.005em;color:var(--text-2);white-space:nowrap}
.hdrbtn:hover .hdrbtn__l{color:var(--text)}
.hdrbtn__b{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;
  background:var(--red);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;
  padding:0 4px;border:2px solid var(--bg);line-height:1;z-index:1}
.hdrbtn__b:empty{display:none}

/* ============================= LAYOUT ============================= */
.wrap{padding:0 var(--gut) 56px}
.stack{display:flex;flex-direction:column;gap:var(--s7);min-width:0}
.stack>*{min-width:0}
.sec{display:flex;flex-direction:column;gap:var(--s3);min-width:0;
  animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.sec__head{display:flex;align-items:baseline;gap:var(--s3)}
.sec__head>div{flex:1;min-width:0}
.sec__title{color:var(--on-bg-2)}
.sec__sub{font-size:var(--t-meta);color:var(--on-bg-3);margin-top:var(--s1);letter-spacing:0;
  text-transform:none;font-weight:400}
.sec__link{margin-left:auto;font-size:13px;font-weight:600;color:var(--blue);white-space:nowrap;
  display:flex;align-items:center;gap:4px}
.sec__link:hover{opacity:.8}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* full-bleed horizontal scrollers */
.rail{display:flex;gap:var(--s3);overflow-x:auto;scrollbar-width:none;
  margin-inline:calc(var(--gut)*-1);padding:var(--s1) var(--gut) var(--s2);scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.rail>*{flex:0 0 auto;scroll-snap-align:start}

/* ============================ CONTROLS ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 var(--s5);
  border-radius:var(--r-pill);font-weight:600;font-size:14.5px;letter-spacing:-.01em;border:1px solid transparent;
  white-space:nowrap;transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .16s,border-color .16s}
.btn:active{transform:scale(.985)}
.btn--primary{background:var(--text);color:#fff}
.btn--primary:hover{background:#000;box-shadow:var(--sh-float)}
.btn--ember{background:var(--red);color:#fff}
.btn--ember:hover{filter:brightness(1.06);box-shadow:0 8px 20px -10px rgba(229,27,35,.9)}
.btn--ghost{background:var(--card);border-color:var(--border);color:var(--text)}
.btn--ghost:hover{border-color:var(--text-3);background:var(--surface)}
.btn--quiet{background:transparent;color:var(--text-2);padding:0 var(--s3);min-height:38px;font-size:13.5px}
.btn--quiet:hover{color:var(--text);background:var(--surface)}
.btn--gold{background:var(--gold);color:#231007}
.btn--gold:hover{filter:brightness(1.06)}
.btn--sm{min-height:36px;font-size:13.5px;padding:0 var(--s4)}
.btn--wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:3px 9px;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.chip--new{background:var(--red);color:#fff}
.chip--urgent{background:var(--red-soft);color:var(--red)}
.chip--active{background:var(--green-soft);color:var(--green)}
.chip--muted{background:var(--surface-muted);color:var(--text-2)}
.chip--gold{background:rgba(199,145,65,.18);color:var(--gold-soft)}

/* CategoryPill */
.tabs{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;width:100%;
  margin-inline:calc(var(--gut)*-1);padding:2px var(--gut) var(--s1)}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);min-height:36px;
  padding:0 var(--s4);font-size:13px;font-weight:600;white-space:nowrap;
  background:var(--card);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-sm);
  transition:background .18s,color .18s,box-shadow .18s,transform .16s}
.tab:hover{color:var(--text);box-shadow:inset 0 0 0 1px var(--border),var(--sh-card)}
.tab[aria-selected="true"]{background:var(--text);color:#fff;box-shadow:var(--sh-card)}
.tab__n{font-size:10.5px;opacity:.6;margin-left:2px}
.tab[aria-selected="true"] .tab__n{opacity:.5}

.search{position:relative;flex:1;min-width:180px}
.search input{width:100%;min-height:44px;border-radius:var(--r-pill);border:1px solid var(--border-soft);
  background:var(--card);padding:0 var(--s4) 0 42px;font-size:14px;color:var(--text);box-shadow:var(--sh-sm)}
.search input::placeholder{color:var(--text-3)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.filters{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;min-width:0}
.empty{padding:var(--s7) var(--s4);text-align:center;color:var(--text-3);font-size:13.5px;
  border:1px dashed var(--border);border-radius:var(--r-md)}

/* ====================== HERO CAROUSEL / HERO CARD ======================
   One card object, seven compositions. The layered slivers behind it are
   the reference's "more offers sit to the side" cue, done in CSS.
   ===================================================================== */
.hero{padding-top:var(--s2)}
.hero__eyebrow{margin-bottom:var(--s3)}
.hero__panel,.hero--default .hero__grid{position:relative;z-index:0;background:var(--card);
  color:var(--text);border-radius:var(--r-xl);padding:var(--s6) var(--s5);
  box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-card)}
.hero__lede{font-size:.9375rem;font-weight:500;letter-spacing:-.015em;margin-top:8px;max-width:20ch;
  color:var(--text);line-height:1.3}
.hero__meta{font-size:13px;color:var(--text-3);margin-top:10px}
.hero__meta b{color:var(--text);font-weight:700}
.hero h1{color:var(--text);font-size:var(--t-display)}

/* default — the ledger */
.hero--default .hero__grid{display:block;background:linear-gradient(180deg,#E9F7F0 0%,var(--card) 46%)}
.hero__top{display:flex;align-items:flex-start;gap:var(--s2)}
.hero__copy{flex:1;min-width:0}
.hero__art{flex:none;margin:-8px -6px 0 0}
.claims{display:flex;flex-direction:column;gap:10px;margin-top:var(--s5)}
.claim{display:flex;align-items:center;gap:var(--s3);background:var(--card);border-radius:var(--r-md);
  padding:var(--s3);box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-sm)}
.claim__b{flex:1;min-width:0}
.claim__t{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.015em;color:var(--text);line-height:1.25}
.claim__s{display:block;font-size:12px;color:var(--text-3);margin-top:2px}
.claim__v{display:block;font-size:12px;color:var(--text-2);font-weight:600;margin-top:1px}
.claim .btn{flex:none;margin:0}
.hero__foot{display:flex;align-items:center;gap:10px;margin-top:var(--s5);padding-top:var(--s4);
  border-top:1px solid var(--border-soft);font-size:13px;color:var(--text-2)}
.hero__foot svg{color:var(--text-3);flex:none}
.hero__foot b{color:var(--text);font-weight:700}
.hero__amount{display:flex;align-items:baseline;gap:1px;font-weight:800;letter-spacing:-.045em;
  font-size:clamp(2.15rem,10.6cqw,2.7rem);line-height:.95;color:var(--text)}
.hero__amount .cur{font-size:.5em;font-weight:700;transform:translateY(-.12em)}
/* welcome — streak */
.streak{display:flex;gap:var(--s2);margin-top:var(--s5)}
.streak__day{flex:1;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);
  padding:var(--s3) var(--s2);text-align:center}
.streak__day.is-done{border-color:transparent;background:var(--green);color:#fff}
.streak__day.is-today{border:1.5px dashed var(--red);background:var(--red-soft)}
.streak__n{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.72}
.streak__mark{font-size:19px;font-weight:700;line-height:1.25}
.streak__day.is-today .streak__mark{color:var(--red)}

/* premium — the one dark card */
.hero--premium .hero__panel{background:linear-gradient(160deg,#1B1C1F,#08080A);color:#F3EFE9;
  box-shadow:var(--sh-lift);border:1px solid rgba(231,198,140,.22)}
.hero--premium h1{color:#fff;font-size:1.5rem;max-width:16ch}
.hero--premium .hero__meta{color:#B9BDC2}
.hero--premium .hero__meta b{color:#fff}
.tier{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(231,198,140,.38);
  border-radius:var(--r-pill);padding:5px 12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;color:var(--gold-soft);margin-bottom:var(--s4)}
.tier__gem{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.prem__row{display:grid;gap:var(--s3);grid-template-columns:repeat(3,minmax(0,1fr));margin-top:var(--s6);
  border-top:1px solid rgba(255,255,255,.14);padding-top:var(--s4)}
.prem__v{font-size:1.15rem;font-weight:800;letter-spacing:-.035em;color:#fff}
.prem__l{font-size:10.5px;line-height:1.35;color:#9FA4AA;margin-top:3px}

/* urgent — countdown */
.hero--urgent .hero__panel{display:grid;gap:var(--s4);justify-items:center;text-align:center;
  border:1px solid var(--red);box-shadow:0 12px 30px -18px rgba(229,27,35,.7)}
.ring{width:128px;height:128px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring__mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring__n{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--text)}
.ring__l{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--red);margin-top:4px}
.hero--urgent h1{font-size:1.45rem}

/* success — receipt */
.hero--success .hero__panel{padding:0;overflow:hidden}
.receipt{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);background:var(--green-soft);
  border-bottom:1px dashed var(--border)}
.receipt__tick{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.receipt__t{font-weight:700;letter-spacing:-.015em;color:var(--text)}
.receipt__s{font-size:11.5px;color:var(--green);margin-top:2px;font-weight:600}
.unlocked{padding:var(--s5)}
.unlocked h1{font-size:1.4rem}
.got{border-top:1px solid var(--border-soft);margin-top:var(--s4)}
.got__row{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--border-soft);min-width:0}
.got__b{min-width:0;flex:1}
.got__t{display:block;font-size:14px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.got__s{display:block;font-size:11.5px;color:var(--text-3);margin-top:1px}
.got__s.is-done{color:var(--green);font-weight:600}
.got__v{font-size:13px;font-weight:700;white-space:nowrap;flex:none;color:var(--text)}
.got__note{font-size:11.5px;color:var(--text-3);text-align:center;margin-top:10px}
.got__all{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:var(--s4);
  font-size:13.5px;font-weight:600;color:var(--green)}

/* low data — meter */
.meter{margin-top:var(--s5)}
.meter__bar{height:10px;border-radius:var(--r-pill);background:var(--surface-muted);overflow:hidden}
.meter__fill{height:100%;border-radius:var(--r-pill);background:var(--red);width:4%;
  transition:width 1s cubic-bezier(.2,.8,.2,1)}
.meter__row{display:flex;justify-content:space-between;margin-top:var(--s2);font-size:11.5px;color:var(--text-3)}
.meter__row b{color:var(--red);font-weight:700}

/* voice — waveform */
.wave{display:flex;align-items:flex-end;gap:3px;height:42px;margin-top:var(--s5)}
.wave i{flex:1;background:var(--red);border-radius:2px;opacity:.8;animation:wv 1.5s ease-in-out infinite alternate}
@keyframes wv{from{height:16%}to{height:100%}}

/* ============================ BENEFIT CARD ============================ */
.grid{display:grid;gap:var(--s3);grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.card{position:relative;min-width:0;background:var(--card);color:var(--text);border-radius:var(--r-lg);
  padding:var(--s5);display:flex;flex-direction:column;gap:var(--s2);box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-sm);
  transition:box-shadow .2s,transform .16s cubic-bezier(.2,.8,.2,1)}
.card:hover{box-shadow:inset 0 0 0 1px var(--border),var(--sh-card)}
.card:active{transform:scale(.995)}
.card__top{display:flex;align-items:flex-start;gap:var(--s3)}
.card__flags{margin-left:auto;display:flex;gap:6px;align-items:center}
.card__title{font-size:var(--t-title);font-weight:700;letter-spacing:-.025em;color:var(--text);overflow-wrap:anywhere}
.card__why{font-size:13px;color:var(--text-2);line-height:1.45}
.card__foot{margin-top:auto;padding-top:var(--s1);display:flex;align-items:center;gap:6px var(--s3);flex-wrap:wrap;min-width:0}
.status{font-size:12.5px;font-weight:600}
.status--ready,.status--active{color:var(--green)}
.status--expiring{color:var(--red)}
.status--locked,.status--past{color:var(--text-3)}
.expiry{font-size:11.5px;color:var(--text-3);margin-left:auto;white-space:nowrap}
.expiry--hot{color:var(--red);font-weight:600}
.card .btn{margin-top:var(--s2)}

/* icon well — soft grey by default, tinted per family */
.card__ico{--tint:var(--surface-muted);width:44px;height:44px;border-radius:var(--r-md);
  display:grid;place-items:center;flex:none;background:var(--tint);box-shadow:inset 0 0 0 1px rgba(16,24,40,.05)}
.card__ico--cash{--tint:#F1ECFF}
.card__ico--ott{--tint:#FFECED}
.card__ico--voucher{--tint:#E6F6EE}
.card__ico--plan{--tint:#E8F4F2}
.card__ico--insider{--tint:#FBF1DE}
.card__ico--game{--tint:#FDECF5}

/* LEVEL 1 — featured */
.card--featured{padding:var(--s6) var(--s5);border-radius:var(--r-xl);box-shadow:var(--sh-card);gap:10px}
.card--featured .card__title{font-size:1.4rem;letter-spacing:-.035em}
.card--featured .card__why{font-size:14px;max-width:40ch}
.card--featured .card__ico{width:54px;height:54px;border-radius:var(--r-lg)}
.card--featured::before{content:"";position:absolute;inset:0;border-radius:var(--r-xl);pointer-events:none;
  box-shadow:inset 0 0 0 1.5px var(--red);opacity:.85}
.card--featured.tone-green::before{box-shadow:inset 0 0 0 1.5px var(--green)}
.card--featured.tone-red::before{box-shadow:inset 0 0 0 1.5px var(--text)}

/* LEVEL 3 — quiet row */
.card--quiet{flex-direction:row;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);
  border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--border-soft);background:var(--card);color:var(--text)}
.card--quiet:hover{box-shadow:inset 0 0 0 1px var(--border),var(--sh-sm)}
.card--quiet .card__ico{width:36px;height:36px;border-radius:var(--r-sm)}
.card--quiet .card__body{min-width:0;flex:1}
.card--quiet .card__title{font-size:14.5px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card--quiet .card__why{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card--quiet .card__foot{margin:0;padding:0;flex-wrap:nowrap;gap:var(--s2);flex:none}
.card--quiet .card__foot:has(.btn) .status{display:none}
.card--quiet .btn{margin:0}
.card--quiet .btn--quiet{color:var(--blue)}
.card--quiet .btn--quiet:hover{background:var(--surface);color:var(--blue)}
.card--past{opacity:.6}
.card--past:hover{opacity:.85}

/* =========================== PLAN / PACK CARD =========================== */
.plan{width:148px;background:var(--card);border-radius:var(--r-md);padding:var(--s4);
  display:flex;flex-direction:column;gap:var(--s2);text-align:left;box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-sm);
  transition:box-shadow .2s,transform .16s cubic-bezier(.2,.8,.2,1)}
.plan:hover{box-shadow:var(--sh-card)}
.plan:active{transform:scale(.98)}
.plan__pill{align-self:flex-start;border:1px solid var(--blue);color:var(--blue);border-radius:var(--r-pill);
  padding:2px 10px;font-size:11px;font-weight:600}
.plan__price{font-size:var(--t-price);font-weight:800;letter-spacing:-.04em;color:var(--text);line-height:1}
.plan__d{font-size:12.5px;color:var(--text-2)}
.plan__go{align-self:flex-end;margin-top:auto;color:var(--text-3)}

/* ========================= EXPLORE SERVICE ICONS ========================= */
.explore{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4) var(--s2)}
.xitem{display:flex;flex-direction:column;align-items:center;gap:var(--s2);text-align:center;
  transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.xitem:hover{transform:translateY(-2px)}
.xitem:active{transform:translateY(0) scale(.96)}
.xitem__c{width:62px;height:62px;border-radius:50%;background:var(--card);display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-sm),0 6px 14px -8px rgba(22,119,255,.35);position:relative}
.xitem:hover .xitem__c{box-shadow:var(--sh-card),0 8px 18px -8px rgba(22,119,255,.6)}
.xitem__l{font-size:11.5px;font-weight:500;color:var(--on-bg-2);line-height:1.25;max-width:9ch}
.xitem__b{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);
  color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
/* featured variant — breaks the circle grid on purpose */
.xfeat{grid-column:1/-1;display:flex;align-items:center;gap:var(--s3);text-align:left;
  background:linear-gradient(100deg,var(--red-soft),var(--card) 62%);border-radius:var(--r-pill);
  padding:10px var(--s5) 10px 10px;box-shadow:var(--sh-sm);transition:box-shadow .2s,transform .16s}
.xfeat:hover{box-shadow:var(--sh-card)}
.xfeat:active{transform:scale(.99)}
.xfeat__c{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;
  flex:none;box-shadow:var(--sh-sm)}
.xfeat__t{display:block;font-size:14px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.xfeat__s{display:block;font-size:11.5px;color:var(--text-2);margin-top:1px}

/* =========================== OFFER CAROUSEL =========================== */
.offer{width:212px;border-radius:var(--r-lg);padding:var(--s5) var(--s4);display:flex;flex-direction:column;
  gap:var(--s1);min-height:150px;color:#fff;text-align:left;position:relative;overflow:hidden;
  box-shadow:var(--sh-card);transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.offer:hover{transform:translateY(-2px);box-shadow:var(--sh-float)}
.offer__t{font-size:15px;font-weight:700;letter-spacing:-.02em}
.offer__p{font-size:1.25rem;font-weight:800;letter-spacing:-.035em;margin-top:2px}
.offer__d{font-size:11.5px;opacity:.72;margin-top:var(--s1);max-width:22ch}
.offer__art{position:absolute;right:-8px;bottom:-6px;opacity:.95}
.offer__b{align-self:flex-start;background:rgba(255,255,255,.18);border-radius:var(--r-pill);
  padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--s2)}

/* ========================== GAMIFICATION ========================== */
.play{display:flex;flex-direction:column;gap:var(--s3)}
.play__card{position:relative;background:var(--card);border-radius:var(--r-lg);padding:var(--s5);
  display:flex;flex-direction:column;gap:var(--s3);box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-sm)}
.play__head{display:flex;align-items:flex-start;gap:var(--s3)}
.play__b{min-width:0;flex:1}
.play__t{display:block;font-weight:700;font-size:15px;letter-spacing:-.02em;color:var(--text);line-height:1.2}
.play__s{display:block;font-size:12.5px;color:var(--text-3);margin-top:3px;line-height:1.35}
.play__new{position:absolute;top:var(--s5);right:var(--s5);background:var(--green-soft);color:var(--green);
  border-radius:var(--r-pill);padding:3px 8px;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase}
.scratch{position:relative;height:172px;border-radius:var(--r-md);overflow:hidden;
  background:linear-gradient(140deg,#E51B23,#8E0D14);display:grid;place-items:center;text-align:center}
.scratch__prize{position:absolute;inset:0;display:grid;place-content:center;gap:4px;text-align:center;
  background:var(--surface);color:var(--text)}
.scratch__amt{font-size:32px;font-weight:800;letter-spacing:-.04em}
.scratch__lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--green)}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.scratch.is-open canvas{display:none}
.wheel-wrap{display:grid;place-items:center;gap:10px;padding:var(--s1) 0}
.wheel-outer{position:relative;width:172px;height:172px}
.wheel{width:172px;height:172px;border-radius:50%;position:relative;border:6px solid var(--card);
  box-shadow:0 0 0 1px var(--border),var(--sh-card);transition:transform 4.2s cubic-bezier(.12,.72,.06,1)}
.wheel__lbl{position:absolute;left:50%;top:50%;transform-origin:0 0;font-size:9.5px;font-weight:600;
  color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.wheel__hub{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:46px;height:46px;
  border-radius:50%;background:var(--card);box-shadow:0 0 0 1px var(--border),var(--sh-sm);
  display:grid;place-items:center;font-size:8.5px;letter-spacing:.08em;font-weight:700;color:var(--text-2);z-index:2}
.wheel__pin{position:absolute;left:50%;top:-5px;transform:translateX(-50%);width:0;height:0;
  border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid var(--text);z-index:3}
.wheel__out{font-size:13px;color:var(--text-2);text-align:center;min-height:18px;line-height:1.3}
.wheel__out b{color:var(--text);font-weight:700}
.task{display:flex;align-items:center;gap:var(--s3);padding:11px 0;border-bottom:1px solid var(--border-soft)}
.task:last-of-type{border-bottom:0}
.task__box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);flex:none;display:grid;place-items:center;color:transparent}
.task.is-done .task__box{background:var(--green);border-color:var(--green);color:#fff}
.task__t{font-size:14px;font-weight:600;color:var(--text)}
.task.is-done .task__t{color:var(--text-3);text-decoration:line-through}
.task__r{margin-left:auto;font-size:11.5px;color:var(--text-3);white-space:nowrap;flex:none}

/* ============================== EXTRAS ============================== */
.extras{display:grid;gap:var(--s3)}
.xcard{background:var(--card);border-radius:var(--r-lg);padding:var(--s5);display:flex;flex-direction:column;
  gap:var(--s1);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-sm)}
.xcard__art{margin-bottom:var(--s2)}
.xcard__v{font-size:var(--t-price);font-weight:800;letter-spacing:-.04em;margin-top:var(--s1);color:var(--text)}
.xcard__s{font-size:13px;color:var(--text-2)}
.xcard .btn{margin-top:var(--s4);align-self:flex-start}
.xcard--coins{background:linear-gradient(150deg,var(--card),var(--amber-soft))}
.xcard--coins .xcard__v{color:var(--amber-ink)}
.coinstack{position:absolute;right:-20px;bottom:-20px;opacity:.14}
.subrow{display:flex;align-items:center;margin-top:10px}
.sublogo{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;font-weight:800;
  font-size:12px;color:#fff;border:2px solid var(--card);margin-right:-8px}

/* ============================= ACTIVITY ============================= */
.act{background:var(--card);border-radius:var(--r-lg);padding:2px var(--s5);box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-sm)}
.act__row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--border-soft);min-width:0}
.act__row:last-child{border-bottom:0}
.act__row>span{min-width:0}
.act__mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.act__t{font-size:14px;font-weight:600;color:var(--text)}
.act__s{font-size:11.5px;color:var(--text-3)}
.act__v{margin-left:auto;font-size:13px;color:var(--text-2);white-space:nowrap;flex:none;font-weight:600}

/* ============================== INSIDER ============================== */
.sec--ins .sec__title{color:var(--on-bg-2)}
.ins{position:relative;border-radius:var(--r-xl);overflow:hidden;padding:var(--s7) var(--s5) var(--s6);
  background:radial-gradient(120% 90% at 50% 38%,#C2164A 0%,var(--ins-1) 42%,var(--ins-2) 100%);
  color:var(--ins-ink);text-align:center;box-shadow:var(--sh-lift)}
.ins__sun{position:absolute;inset:-30% -10%;pointer-events:none;opacity:.55;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.075) 0deg 5deg,transparent 5deg 13deg);
  -webkit-mask:radial-gradient(closest-side,#000 30%,transparent 78%);mask:radial-gradient(closest-side,#000 30%,transparent 78%)}
.ins__h{position:relative;font-weight:800;line-height:1.02;font-size:2rem;letter-spacing:-.042em;color:var(--ins-cream)}
.ins__k{position:relative;font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;
  color:rgba(251,239,228,.75);margin-top:10px}
.orbit{position:relative;width:240px;height:240px;margin:var(--s4) auto var(--s1)}
.orbit__ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.orbit__ring--i{inset:30px;border-color:rgba(255,255,255,.11)}
.orbit__spin{position:absolute;inset:0;animation:orb 46s linear infinite}
.orbit__sat{position:absolute;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  animation:orb 46s linear infinite reverse;box-shadow:0 6px 16px -5px rgba(40,0,12,.7);
  font-weight:800;font-size:11px;color:#fff;text-align:center;line-height:1.05}
.orbit__sat--li{left:0;top:58px;background:#0A66C2;font-size:17px}
.orbit__sat--cr{left:194px;top:100px;background:#0C0C0C;font-size:9.5px;
  box-shadow:0 0 0 1px rgba(255,255,255,.22),0 6px 16px -5px rgba(40,0,12,.7)}
.orbit__sat--pf{left:32px;top:176px;background:#E1265B;font-size:9px}
.orbit__dot{position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}
.orbit__core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:140px;height:76px;
  border-radius:38px;display:grid;place-items:center;
  background:linear-gradient(150deg,rgba(255,255,255,.17),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.24);box-shadow:0 10px 26px -10px rgba(60,0,18,.75),inset 0 1px 0 rgba(255,255,255,.26)}
.orbit__core span{display:block;font-size:25px;font-weight:800;letter-spacing:-.035em;color:#fff;text-align:center}
@keyframes orb{to{transform:rotate(360deg)}}
.ins__tier{position:relative;margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--ins-line);
  display:flex;align-items:center;gap:var(--s3);text-align:left}
.ins__tier b{font-size:13.5px;font-weight:700}
.ins__tier p{font-size:11.5px;color:var(--ins-dim);margin-top:2px}
.ins__lvl{margin-left:auto;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  color:var(--ins-cream);border:1px solid rgba(248,228,188,.42);border-radius:var(--r-pill);
  padding:4px 9px;white-space:nowrap;flex:none}
.ins__bar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:var(--s3);overflow:hidden}
.ins__fill{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),#F0D9A6);width:66%}
.ins .btn{margin-top:var(--s4);position:relative}
/* ============================ PARTNER APP MOCK ============================ */
.app{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;color:#fff;
  opacity:0;transform:scale(.99);pointer-events:none;
  transition:opacity .26s,transform .3s cubic-bezier(.2,.9,.2,1)}
.app.is-open{opacity:1;transform:none;pointer-events:auto}
.app[hidden]{display:none}
.app__bar{flex:none;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--gut)}
.app__back{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.12);color:#fff}
.app__back:hover{background:rgba(255,255,255,.2)}
.app__wm{font-size:15px;font-weight:900;letter-spacing:.16em;color:var(--app-ink,#E50914)}
.app__ava{margin-left:auto;width:26px;height:26px;border-radius:5px;
  background:linear-gradient(140deg,#4E86F7,#8B5CF6);flex:none}
.app__scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:var(--s6);scrollbar-width:none}
.app__scroll::-webkit-scrollbar{display:none}
.app__hero{padding:var(--s10) var(--gut) var(--s6);text-align:center;display:flex;
  flex-direction:column;align-items:center;gap:6px}
.app__top{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(255,255,255,.16);border-radius:var(--r-pill);padding:4px 10px}
.app__hero h2{font-size:1.6rem;font-weight:800;letter-spacing:-.035em;margin-top:var(--s3);color:#fff}
.app__hero p{font-size:12.5px;color:rgba(255,255,255,.66)}
.app__acts{display:flex;gap:var(--s2);margin-top:var(--s4)}
.app__play,.app__list{border-radius:6px;padding:10px 20px;font-size:13.5px;font-weight:700}
.app__play{background:#fff;color:#111}
.app__list{background:rgba(255,255,255,.18);color:#fff}
.app__row{margin-top:var(--s6);padding-left:var(--gut)}
.app__rowh{font-size:13px;font-weight:700;margin-bottom:10px;color:rgba(255,255,255,.9)}
.app__tiles{display:flex;gap:10px;overflow-x:auto;padding-right:var(--gut);scrollbar-width:none}
.app__tiles::-webkit-scrollbar{display:none}
.tile{width:94px;flex:none}
.tile__p{display:grid;place-items:end start;height:130px;border-radius:7px;padding:8px}
.tile__b{background:rgba(0,0,0,.55);border-radius:4px;padding:2px 6px;font-size:9px;font-weight:700}
.tile__t{display:block;font-size:10.5px;color:rgba(255,255,255,.62);margin-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app__note{margin:var(--s6) var(--gut) 0;background:rgba(255,255,255,.1);border-radius:var(--r-md);
  padding:var(--s4);font-size:12px;line-height:1.55;color:rgba(255,255,255,.78)}
.app__note b{color:#fff;font-weight:700}
.app__link{display:block;margin-top:10px;font-size:12.5px;font-weight:700;color:#fff;text-decoration:underline}
@media (min-width:900px){ .app{position:absolute} }

/* account-linked rewards show where they live, not a code */
.linked{display:flex;align-items:center;gap:var(--s3);background:var(--card);border-radius:var(--r-md);
  padding:var(--s3) var(--s4);box-shadow:inset 0 0 0 1px var(--border-soft)}
.linked__i{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none;
  background:var(--surface-muted)}
.linked__b{flex:1;min-width:0}
.linked__t{display:block;font-size:14px;font-weight:700;color:var(--text)}
.linked__s{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px}

/* ======================= PRODUCT PAGE · TOAST · MOTION ======================= */
.page{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .24s,transform .28s cubic-bezier(.2,.9,.2,1)}
.page.is-open{opacity:1;transform:none;pointer-events:auto}
.page[hidden]{display:none}
.page__bar{flex:none;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--gut);
  background:var(--bg);border-bottom:1px solid var(--border-soft)}
.page__back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text);
  background:var(--card);box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-sm);flex:none}
.page__back:hover{box-shadow:inset 0 0 0 1px var(--border),var(--sh-card)}
.page__brandbar{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page__scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 var(--gut) var(--s6);scrollbar-width:none}
.page__scroll::-webkit-scrollbar{display:none}

.page__hero{--tint:var(--surface-muted);background:var(--tint);border-radius:var(--r-xl);
  padding:var(--s6) var(--s5);margin-top:var(--s4);text-align:center}
.page__logo{display:grid;place-items:center;width:72px;height:72px;border-radius:var(--r-lg);margin:0 auto var(--s4);
  background:var(--card);box-shadow:var(--sh-card)}
.page__brand{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2)}
.page__hero h1{font-size:1.4rem;margin-top:var(--s2);color:var(--text)}
.page__why{font-size:13px;color:var(--text-2);margin-top:var(--s2)}
.page__value{font-size:1.15rem;font-weight:800;letter-spacing:-.035em;color:var(--text);margin-top:var(--s4)}
.page__value span{font-size:.72em;font-weight:600;color:var(--text-2);letter-spacing:0}

.vald{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s3);
  background:var(--card);border-radius:var(--r-md);padding:var(--s4) var(--s3);
  box-shadow:inset 0 0 0 1px var(--border-soft),var(--sh-sm)}
.vald__i{text-align:center;min-width:0}
.vald__l{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.vald__v{display:block;font-size:13px;font-weight:700;color:var(--text);margin-top:5px;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.vald__v.is-hot{color:var(--red)}

.page__sec{margin-top:var(--s6);display:flex;flex-direction:column;gap:var(--s3)}
.page__sec .sec__title{color:var(--text-2)}
.perks{display:flex;flex-direction:column;gap:var(--s2)}
.perk{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--text);line-height:1.45;
  background:var(--card);border-radius:var(--r-md);padding:var(--s3) var(--s4);
  box-shadow:inset 0 0 0 1px var(--border-soft)}
.perk__t{width:18px;height:18px;border-radius:50%;background:var(--green-soft);color:var(--green);
  display:grid;place-items:center;flex:none;margin-top:1px}

.code{display:flex;align-items:center;gap:var(--s3);background:var(--card);border-radius:var(--r-md);
  padding:var(--s4);box-shadow:inset 0 0 0 1px var(--border-soft)}
.code.is-open{box-shadow:inset 0 0 0 1.5px var(--green)}
.code__v{flex:1;min-width:0;font-size:17px;font-weight:700;letter-spacing:.09em;color:var(--text-3);
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.code.is-open .code__v{color:var(--text)}
.code__c{flex:none;border-radius:var(--r-pill);padding:8px 14px;font-size:12.5px;font-weight:700;
  background:var(--surface-muted);color:var(--text)}
.code__c:hover{background:var(--border)}
.code__h{font-size:12px;color:var(--text-3);line-height:1.5}

.steps{display:flex;flex-direction:column;gap:var(--s3);counter-reset:s}
.steps li{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--text-2);line-height:1.45}
.steps b{width:20px;height:20px;border-radius:50%;background:var(--text);color:#fff;font-size:11px;
  display:grid;place-items:center;flex:none;margin-top:1px}
.page__terms{font-size:11.5px;color:var(--text-3);line-height:1.6;margin-top:var(--s6)}

.page__foot{flex:none;padding:var(--s4) var(--gut) calc(var(--s4) + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--border-soft);box-shadow:0 -6px 18px rgba(16,24,40,.06)}
.handoff{display:flex;align-items:center;justify-content:center;gap:var(--s3);padding:var(--s2) 0;
  font-size:13.5px;font-weight:600;color:var(--text-2)}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--red);
  animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (min-width:900px){ .page{position:absolute} }

.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;
  flex-direction:column;gap:var(--s2);width:calc(100% - 32px);max-width:400px;pointer-events:none}
.toast{background:var(--card);color:var(--text);border-radius:var(--r-md);padding:var(--s3) var(--s4);
  font-size:13.5px;box-shadow:var(--sh-lift);display:flex;align-items:center;gap:10px;
  animation:tin .3s cubic-bezier(.2,.9,.2,1)}
.toast b{font-weight:700}
.toast__t{width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
@keyframes tin{from{transform:translateY(14px);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:85}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .wave i{height:60%}
}
</style>
</head>
<body>
<!-- ============ PROTOTYPE CHROME — demo control, never inside the product ============ -->
<div class="stage">
  <div class="chrome">
    <div class="chrome__in">
      <span class="chrome__label"><span class="chrome__dot"></span>Preview experience</span>
      <div class="chrome__field">
        <label class="sr" for="cohort">Preview cohort</label>
        <select id="cohort">
          <option value="active">Default — Active customer</option>
          <option value="dormant">Cohort A — Dormant / low engagement</option>
          <option value="voice">Cohort B — Prepaid voice-only</option>
          <option value="arpu">Cohort C — High-ARPU Fiber / Postpaid</option>
          <option value="data">Cohort D — Data-exhausted</option>
          <option value="expiring">State — Expiring benefits</option>
          <option value="recharged">State — Just recharged</option>
        </select>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <p class="chrome__note" id="chromeNote"></p>
      <div class="chrome__hints"><span>Hero</span><span>Section order</span><span>Priority</span><span>Card weight</span><span>CTA</span><span>Urgency</span></div>
      <p class="chrome__cap">Designed at 375&nbsp;px. Everything inside the frame is the shipping experience.</p>
    </div>
  </div>

  <!-- ============ PRODUCT ============ -->
  <div class="device">
    <div class="statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="statusbar__r">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" opacity=".85"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="15" height="11" viewBox="0 0 24 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".85"><path d="M2 5.5a15 15 0 0 1 20 0M5.6 9.6a10 10 0 0 1 12.8 0M9.4 13.8a5 5 0 0 1 5.2 0"/><circle cx="12" cy="16.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        <span class="batt"></span>
      </span>
    </div>

    <div class="screen" id="screen">
      <header class="head" id="head">
        <div class="head__in">
          <a class="brand" href="#hub">Benefits</a>
          <div class="head__acts" id="headActs"></div>
        </div>
      </header>
      <main class="wrap" id="hub"><div class="stack" id="stack"></div></main>
    </div>

    <div class="homebar" aria-hidden="true"><i></i></div>

    <div class="page" id="page" role="dialog" aria-modal="true" aria-labelledby="pageTitle" hidden></div>
    <div class="app" id="app" role="dialog" aria-modal="true" aria-label="Partner app" hidden></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  </div>

  <aside class="rat" id="rat" aria-label="Design rationale"></aside>
</div>

<script>
/* ============================================================================
   UNIFIED BENEFITS HUB — prototype
   Architecture (single-file port of the component tree):
     rewardData      → BENEFITS, ACTIVITY, SUBS
     cohortConfig    → COHORTS (hero variant, section order, weights, nudge)
     priorityEngine  → score() + rank()
     components      → Hero*, PrioritySection, BenefitCard, BenefitGrid,
                       FilterBar, GamifiedReward(ScratchCard, SpinWheel),
                       CoinsCard, SubscriptionsCard, ActivitySection,
                       ClaimDialog, ToastFeedback
   ========================================================================== */

/* ---------------------------- icons ---------------------------- */
const I = {
  cash:'<path d="M7 7h10M7 11h10M9 7c3 0 5 2 5 5s-2 5-5 5h6"/>',
  ott:'<rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="m10 9.5 5 2.5-5 2.5z"/>',
  voucher:'<path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v2M14 11v2M14 16v2"/>',
  plan:'<path d="M4 20V10M10 20V4M16 20v-8M22 20h-2"/>',
  insider:'<path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.8 6.7 19.7l1.1-6.1L3.4 9.4l6-.8z"/>',
  game:'<path d="M12 3v18M3 12h18M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  music:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  coin:'<circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5h5M9.5 12h5M11 9.5c2 0 3 1 3 2.5s-1 2.5-3 2.5h3.5"/>',
  sub:'<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  tick:'<path d="m5 12.5 4.5 4.5L19 7"/>',
  arrow:'<path d="M5 12h13M13 6.5 18.5 12 13 17.5"/>',
  zap:'<path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12z"/>',
  wifi:'<path d="M2.5 9a15 15 0 0 1 19 0M6 12.7a10 10 0 0 1 12 0M9.5 16.4a5 5 0 0 1 5 0"/><circle cx="12" cy="20" r="1"/>',
  gift:'<path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z"/>',
  sparkle:'<path d="M12 3v6M12 15v6M3 12h6M15 12h6M6.5 6.5l3 3M14.5 14.5l3 3M17.5 6.5l-3 3M9.5 14.5l-3 3"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 5.2a3.5 3.5 0 0 1 0 5.6M18 20a6.6 6.6 0 0 0-2-4.7"/>',
  card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h3"/>',
  home:'<path d="M3.5 11 12 4l8.5 7M6 9.5V20h4v-5.5h4V20h4V9.5"/>',
  x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>'
};
const ico = (n,s=18,w=1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||I.gift}</svg>`;
const money = n => '₹' + n.toLocaleString('en-IN');

/* ---------------------------- illustrated art ----------------------------
   Line icons say "UI control"; these say "this is a thing you own".
   Each is two or three tones plus a highlight, drawn on a 32-unit canvas.
   Gradient ids are per-instance so the same icon can repeat on a page.
   ------------------------------------------------------------------------ */
const lg = (id,a,b,x2=0,y2=1) =>
  `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const gloss = d => `<path d="${d}" stroke="rgba(255,255,255,.55)" stroke-width="1.6" stroke-linecap="round" fill="none"/>`;

const ART = {
  /* gold coin — cashback credited */
  coin: u => `<defs>${lg(u,'#FBDD92','#C98D2B')}${lg(u+'b','#FFF3D4','#F0C367')}</defs>
    <circle cx="16" cy="17" r="11" fill="#8A5C15"/><circle cx="16" cy="15.5" r="11" fill="url(#${u})"/>
    <circle cx="16" cy="15.5" r="7.6" fill="none" stroke="url(#${u}b)" stroke-width="1.2" opacity=".85"/>
    <text x="16" y="20.4" text-anchor="middle" font-size="11.5" font-weight="800" fill="#7A4E12">₹</text>
    ${gloss('M8.6 12.2a8.4 8.4 0 0 1 6.2-4.4')}`,
  /* violet notes — cash reward */
  cash: u => `<defs>${lg(u,'#B18BF0','#6A3CC0')}${lg(u+'b','#D9C8FF','#A683ED')}</defs>
    <rect x="7" y="9" width="20" height="13" rx="2.4" fill="#5A2FA8" transform="rotate(-11 17 15.5)"/>
    <rect x="5" y="11.5" width="21" height="12.5" rx="2.4" fill="url(#${u})"/>
    <circle cx="15.5" cy="17.7" r="3.7" fill="url(#${u}b)"/>
    <text x="15.5" y="21.2" text-anchor="middle" font-size="7.5" font-weight="800" fill="#4A1F92">₹</text>
    <rect x="7.4" y="13.8" width="2.6" height="2.6" rx=".7" fill="rgba(255,255,255,.5)"/>
    <rect x="21" y="19.2" width="2.6" height="2.6" rx=".7" fill="rgba(255,255,255,.35)"/>`,
  /* mint vouchers — gift cards */
  voucher: u => `<defs>${lg(u,'#A8F0CC','#2E9A72')}${lg(u+'b','#7FE3B6','#279066')}</defs>
    <rect x="12" y="7" width="13" height="19" rx="2.4" fill="url(#${u}b)" transform="rotate(12 18 16)"/>
    <rect x="6" y="7" width="14" height="19" rx="2.4" fill="url(#${u})"/>
    <path d="M13 7v19" stroke="#1F7B57" stroke-width="1.1" stroke-dasharray="2 2" opacity=".6"/>
    <path d="M13 13c-2.4 0-3.2-1-3.2-2 0-.9.8-1.6 1.7-1.3 1 .3 1.5 1.7 1.5 3.3zm0 0c2.4 0 3.2-1 3.2-2 0-.9-.8-1.6-1.7-1.3-1 .3-1.5 1.7-1.5 3.3z" fill="#136B49"/>
    ${gloss('M8.4 10.4a2 2 0 0 1 1.6-1.2')}`,
  /* screen + play — OTT */
  play: u => `<defs>${lg(u,'#FF6F76','#B90E1B')}${lg(u+'b','#FFC9CC','#FF7A80')}</defs>
    <rect x="3.5" y="7" width="25" height="18" rx="4" fill="#7C0711"/>
    <rect x="3.5" y="6" width="25" height="18" rx="4" fill="url(#${u})"/>
    <path d="M13.6 10.8 20.4 15l-6.8 4.2z" fill="#fff"/>
    ${gloss('M6.6 9.4a2.6 2.6 0 0 1 2.2-1.6')}`,
  /* signal bars — plan benefit */
  signal: u => `<defs>${lg(u,'#8FE3D2','#1F8E7C')}</defs>
    <rect x="5" y="18" width="4.6" height="8" rx="1.6" fill="#1F8E7C" opacity=".55"/>
    <rect x="11.4" y="13" width="4.6" height="13" rx="1.6" fill="url(#${u})" opacity=".8"/>
    <rect x="17.8" y="8.5" width="4.6" height="17.5" rx="1.6" fill="url(#${u})"/>
    <circle cx="26" cy="9" r="2.6" fill="#FFD27A"/>`,
  /* star — insider / premium */
  star: u => `<defs>${lg(u,'#FFE6AE','#C4862A')}</defs>
    <path d="m16 4 3.4 7.2 7.6 1-5.6 5.4 1.4 7.8L16 21.6 9.2 25.4l1.4-7.8L5 12.2l7.6-1z" fill="url(#${u})"/>
    <path d="m16 8.2 2 4.3 4.6.6-3.4 3.2.8 4.7L16 18.6z" fill="rgba(255,255,255,.35)"/>
    <circle cx="25.5" cy="7" r="1.6" fill="#FFF1CE"/>`,
  /* gift box — game / earnable */
  gift: u => `<defs>${lg(u,'#FF8BC2','#C2277E')}${lg(u+'b','#FFC2DE','#FF74B4')}</defs>
    <rect x="6" y="13" width="20" height="13" rx="2.2" fill="url(#${u})"/>
    <rect x="4.4" y="9" width="23.2" height="5.4" rx="1.8" fill="url(#${u}b)"/>
    <rect x="14.4" y="9" width="3.2" height="17" fill="rgba(255,255,255,.55)"/>
    <path d="M16 9c-2.6 0-4.2-1.2-4.2-2.5S13 4.4 14 5c1.1.7 2 2.3 2 4zm0 0c2.6 0 4.2-1.2 4.2-2.5S19 4.4 18 5c-1.1.7-2 2.3-2 4z" fill="#FFD6E8"/>`,
  /* note — music / HelloTune */
  music: u => `<defs>${lg(u,'#FF9AA2','#D8232F')}</defs>
    <path d="M12.5 21V8.4l11-2.2V18" stroke="url(#${u})" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <ellipse cx="10" cy="22" rx="4" ry="3.4" fill="url(#${u})"/>
    <ellipse cx="21" cy="19.4" rx="3.4" ry="2.9" fill="url(#${u})"/>`,
  /* gauge — data */
  data: u => `<defs>${lg(u,'#8CC8FF','#2168C4')}</defs>
    <path d="M5.5 22a11 11 0 0 1 21 0" stroke="#1E4E8C" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".45"/>
    <path d="M5.5 22A11 11 0 0 1 9 14" stroke="url(#${u})" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="m16 21 5.4-6.6" stroke="#FF8348" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="16" cy="21.6" r="2.6" fill="#DCE9FA"/>`,
  /* two people — family linking */
  family: u => `<defs>${lg(u,'#9FD8FF','#3273C6')}</defs>
    <circle cx="12" cy="11" r="4.4" fill="url(#${u})"/>
    <path d="M4.5 25a7.5 7.5 0 0 1 15 0z" fill="url(#${u})"/>
    <circle cx="22" cy="12.6" r="3.4" fill="#6FA9E6" opacity=".8"/>
    <path d="M17.5 25a6 6 0 0 1 10.5-4" stroke="#6FA9E6" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".8"/>`,
  /* card — autopay / billing */
  card: u => `<defs>${lg(u,'#8FE3B9','#20845E')}</defs>
    <rect x="3.5" y="8" width="25" height="16" rx="3" fill="url(#${u})"/>
    <rect x="3.5" y="12" width="25" height="3.4" fill="#0C5C40"/>
    <rect x="6.5" y="18.5" width="6" height="2.4" rx="1.2" fill="rgba(255,255,255,.75)"/>
    ${gloss('M6.4 10.4a2.4 2.4 0 0 1 2-1.2')}`,
  /* wifi — fiber */
  wifi: u => `<defs>${lg(u,'#A6E7F5','#1E8FB0')}</defs>
    <path d="M4 11.5a18 18 0 0 1 24 0" stroke="url(#${u})" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M8.4 16.4a12 12 0 0 1 15.2 0" stroke="url(#${u})" stroke-width="3" stroke-linecap="round" fill="none" opacity=".78"/>
    <path d="M12.6 21.2a6 6 0 0 1 6.8 0" stroke="url(#${u})" stroke-width="3" stroke-linecap="round" fill="none" opacity=".56"/>
    <circle cx="16" cy="25.4" r="2.2" fill="#CFF0F9"/>`,
  /* shield — device cover */

/* ============================== priorityEngine.ts ==========================
   priorityScore = urgency · recency · userRelevance · rewardValue · engagement
   Every factor is normalised 0–1, then weighted by the cohort. The score does
   two jobs: it ORDERS the benefits, and it sets each card's VISUAL WEIGHT
   (featured → standard → quiet), so prioritisation is visible, not just sorted.
   ========================================================================== */
const clamp01 = n => Math.max(0, Math.min(1, n));

function score(b, cfg){
  // Spent or lapsed benefits never compete for attention.
  if (b.state === 'used' || b.state === 'expired') return 0.04;

  // 1. Urgency — a 14-day runway; today = 1, anything further out decays fast.
  const urgency  = b.exp === null ? 0 : clamp01(1 - b.exp / 14);
  // 2. Recency — just-earned beats long-held, and unclaimed beats already-on.
  const recency  = b.isNew ? 1 : (b.state === 'ready' ? .5 : .2);
  // 3. Relevance — tag overlap with what this cohort actually cares about.
  const hits     = b.tags.filter(t => cfg.relevant.includes(t)).length;
  const relevance= clamp01(hits / 1.5);
  // 4. Value — ₹ worth, flattened so one big voucher can't own the page.
  const value    = clamp01(Math.sqrt(b.value) / 39);
  // 5. Engagement opportunity — something still to unlock is a hook.
  const engage   = b.state === 'locked' ? .95 : .2;

  const w = cfg.weights;
  return urgency*w.urgency + recency*w.recency + relevance*w.relevance
       + value*w.value + engage*w.engage;
}

function rank(ids, cfg){
  return ids.map(id => ({...B[id], _s: score(B[id], cfg)}))
            .sort((a, b) => b._s - a._s);
}
// Visual weight bands. Only ONE card is ever allowed to be featured.
function weightOf(b, i, top){
  if (b.state === 'used' || b.state === 'expired') return 'past';
  if (i === 0 && b._s >= .5 && b._s === top) return 'featured';
  if (b._s < .3) return 'quiet';
  return 'standard';
}

  };
}

let inAttention = new Set();

  hero(cfg){ return el(HEROES[cfg.hero](cfg, totals(cfg))); },

  attention(cfg){
    const ranked = rank(cfg.ids,cfg).map(view)
      .filter(b => !inAttention.has(b.id))   // never repeat the recommended action
      .filter(b => b.type !== 'game')        // games belong in Earn more
      .filter(b => b.state==='ready' || (b.state==='locked' && cfg.hero==='lowdata'));
    const top = ranked.slice(0, cfg.hero==='success' ? 3 : 2);

  /* FilterBar + BenefitGrid */
  benefits(cfg){
    const filtering = state.filter !== 'all' || state.q.trim() !== '';
    const all = rank(cfg.ids,cfg).map(view);
    const counts = {
      all: all.length,
      ready: all.filter(b=>b.state==='ready').length,
      active: all.filter(b=>b.state==='active').length,
      expiring: all.filter(b=>b.exp!==null&&b.exp<=2&&(b.state==='ready'||b.state==='active')).length,
      used: all.filter(b=>b.state==='used').length,
      expired: all.filter(b=>b.state==='expired').length
    };
    const q = state.q.trim().toLowerCase();
    let list = all.filter(b=>{
      if (!filtering && inAttention.has(b.id)) return false;   // no duplicate of the priority row
      if (b.state === 'locked' && b.type === 'game') return false; // lives in Earn more
      if (q && !(b.title+' '+b.why).toLowerCase().includes(q)) return false;
      if (state.filter==='ready')    return b.state==='ready';
      if (state.filter==='active')   return b.state==='active';
      if (state.filter==='expiring') return b.exp!==null && b.exp<=2 && (b.state==='ready'||b.state==='active');
      if (state.filter==='used')     return b.state==='used';
      if (state.filter==='expired')  return b.state==='expired';
      return true;
    });
    const TABI = {all:'home', ready:'zap', active:'ott', expiring:'clock', used:'tick', expired:'x'};
    const tab = (k,l,n) => `<button class="tab" role="tab" data-filter="${k}" aria-selected="${state.filter===k}">
      ${ico(TABI[k],14,2.2)}${l}<span class="tab__n">${n}</span></button>`;

    if (!list.length){
      g.appendChild(el(`<div class="empty" style="grid-column:1/-1">Nothing here${q?` for “${esc(state.q)}”`:''}. Try “All”.</div>`));

      const best = list[0]._s;

        g.appendChild(BenefitCard(b, w==='featured' ? 'standard' : w));

/* =============================== renderer ================================== */
const stack = $('#stack');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function render(animate = true){
  const cfg = COHORTS[state.cohort];
  cfg.id = state.cohort;
  const before = new Map();
  if (animate && !reduce) stack.querySelectorAll('[data-flip]').forEach(n => before.set(n.dataset.flip, n.getBoundingClientRect()));

  const focused = document.activeElement?.id === 'q';
  const caret = focused ? $('#q').selectionStart : null;

  inAttention = new Set();
  stack.innerHTML = '';
  cfg.sections.forEach((id, i) => {
    const node = SECTIONS[id](cfg);
    if (!node) return;
    node.style.animationDelay = (animate && !reduce) ? `${i * 45}ms` : '0ms';
    stack.appendChild(node);
  });

  // FLIP: sections that survive the cohort change slide to their new slot
  if (animate && !reduce){
    stack.querySelectorAll('[data-flip]').forEach(n => {
      const b = before.get(n.dataset.flip); if (!b) return;
      const a = n.getBoundingClientRect();
      const dy = b.top - a.top, dx = b.left - a.left;
      if (Math.abs(dy) < 2 && Math.abs(dx) < 2) return;
      n.style.animation = 'none';
      n.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],
                {duration:460, easing:'cubic-bezier(.2,.85,.2,1)'});
    });
  }

  if (focused){ const q = $('#q'); q.focus(); q.setSelectionRange(caret, caret); }
  initScratch();
  if (state.cohort === 'data') requestAnimationFrame(()=>{ const m = $('#meterFill'); if (m) m.style.width = '4%'; });
  const badge = document.getElementById('hBadge');
  if (badge) badge.textContent = totals(cfg).ready || '';
  $('#chromeNote').innerHTML = `<b>${esc(cfg.label)}.</b> ${esc(cfg.note)}`;
  const rat = document.getElementById('rat');
  if (rat) rat.innerHTML = `
    <p class="rat__h"><i></i>Why this screen</p>
    <p class="rat__s">What the priority engine chose for <b>${esc(cfg.label)}</b>, and the principle behind each call.</p>
    <div class="rat__l">${(cfg.ux || []).map(([t,d]) =>
      `<div class="rat__i"><div class="rat__t">${esc(t)}</div><div class="rat__d">${esc(d)}</div></div>`).join('')}
      <div class="rat__i"><div class="rat__t">Jakob's law</div>
        <div class="rat__d">Pill filters, circular quick actions and bottom-sheet claims are borrowed from apps this user already has. Familiar form, so the content is the only new thing.</div></div>
    </div>
    <p class="rat__f">Every touch target is at least 44&nbsp;px; motion runs 150–220&nbsp;ms and is disabled under reduced-motion.</p>`;
}

/* ============================== ScratchCard ================================ */
function initScratch(){
  const box = $('#scratch'), cv = $('#scratchCanvas');
  if (!cv || state.scratch.open) return;
  const r = box.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  const g = c.createLinearGradient(0, 0, r.width, r.height);
  g.addColorStop(0, '#E51B23'); g.addColorStop(.55, '#B20E18'); g.addColorStop(1, '#7C0A0F');
  c.fillStyle = g; c.fillRect(0, 0, r.width, r.height);

  let drawing = false, cleared = 0, touched = false;
  // the prompt and the gift live ON the cover, so they scratch away with it
  c.save();
  c.fillStyle = 'rgba(255,255,255,.94)';
  c.textAlign = 'center';
  c.font = '700 10px Inter, system-ui, sans-serif';
  try { c.letterSpacing = '2.2px'; } catch (e) {}
  c.fillText('SCRATCH TO REVEAL', r.width / 2, r.height - 22);
  c.restore();
  const img = new Image();
  img.onload = () => {
    if (touched || state.scratch.open) return;
    c.save(); c.globalCompositeOperation = 'source-over';
    const w = Math.min(84, r.width * .3);
    c.drawImage(img, (r.width - w) / 2, r.height / 2 - w / 2 - 12, w, w);
    c.restore();
  };
  img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">${ART.gift('sc')}</svg>`);

  c.globalCompositeOperation = 'destination-out';
  const at = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const rub = e => {
    if (!drawing) return;
    touched = true;
    const [x, y] = at(e);
    c.beginPath(); c.arc(x, y, 22, 0, 7); c.fill();
    if (++cleared % 9 === 0 && cleared > 16) check();
  };
  const check = () => {
    const d = c.getImageData(0, 0, cv.width, cv.height).data;
    let clear = 0; for (let i = 3; i < d.length; i += 4 * 40) if (d[i] === 0) clear++;
    if (clear / (d.length / (4 * 40)) > .42) reveal();
  };
  const reveal = () => {
    state.scratch.open = true; box.classList.add('is-open');
    burst(box); toast('₹100 cashback revealed', 'Redeem it before 17 Sep.');
    render(false);
  };
  cv.addEventListener('pointerdown', e => { drawing = true; cv.setPointerCapture(e.pointerId); rub(e); });
  cv.addEventListener('pointermove', rub);
  cv.addEventListener('pointerup', () => { drawing = false; check(); });
  cv.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } });
  cv.tabIndex = 0; cv.setAttribute('role','button'); cv.setAttribute('aria-label','Scratch card — press Enter to reveal your reward');
}

/* =============================== SpinWheel ================================= */
function spin(){
  if (state.spin.spinning || state.spin.result) return;
  const segs = ['₹10 cashback','50 MB data','₹100 voucher','Better luck','1 GB data','₹25 cashback'];
  const pick = 4;                                   // demo lands on "1 GB data"
  const step = 360 / segs.length;
  const target = 360 * 4 + (360 - (pick * step + step / 2));
  state.spin.spinning = true;
  const w = $('#wheel');
  w.style.transform = `rotate(${target}deg)`;
  const finish = () => {
    state.spin.angle = target % 360; state.spin.result = segs[pick]; state.spin.spinning = false;
    toast('You won 1 GB data', 'Added to your account instantly.');
    burst($('#wheel'));
    render(false);
  };
  reduce ? finish() : setTimeout(finish, 4300);
}

/* =============================== feedback ================================== */
function toast(title, sub){
  const t = el(`<div class="toast"><span class="toast__t">${ico('tick',12,3)}</span>
    <span><b>${esc(title)}</b>${sub ? `<br><span style="opacity:.75">${esc(sub)}</span>` : ''}</span></div>`);
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s, transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 320); }, 3400);
}
function burst(anchor){
  if (reduce || !anchor) return;
  const r = anchor.getBoundingClientRect(), layer = el('<div class="confetti"></div>');
  document.body.appendChild(layer);
  const cols = ['#E30613','#D4530F','#0E7A55','#C79141'];
  for (let i = 0; i < 22; i++){
    const p = document.createElement('i');
    p.style.cssText = `position:absolute;width:7px;height:11px;border-radius:2px;background:${cols[i%4]};
      left:${r.left + r.width/2}px;top:${r.top + r.height/2}px`;
    layer.appendChild(p);
    p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:`translate(${(Math.random()-.5)*300}px,${-120 - Math.random()*160}px) rotate(${Math.random()*540}deg)`,opacity:0}],
      {duration:900 + Math.random()*500, easing:'cubic-bezier(.15,.7,.3,1)'});
  }
  setTimeout(() => layer.remove(), 1500);
}

/* =============================== events ==================================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act], [data-filter]');
  if (!t) return;
  const a = t.dataset.act;
  if (t.dataset.filter){ state.filter = t.dataset.filter; render(false); return; }
  if (a === 'open')          openProduct(t.dataset.id);
  else if (a === 'closePage')closeProduct();
  else if (a === 'openApp')  openApp(t.dataset.brand);
  else if (a === 'closeApp') closeApp();
  else if (a === 'confirm')  confirmProduct();
  else if (a === 'copyCode'){
    navigator.clipboard?.writeText(t.dataset.code).then(
      () => toast('Number copied', t.dataset.code),
      () => toast('Copy failed', 'Write the number down instead.'));
  }
  else if (a === 'spin')   spin();
  else if (a === 'toast')  toast(t.dataset.msg);
  else if (a === 'claimAll'){
    ['cash100','ott599','shop50'].forEach(id => B[id].type === 'ott' ? state.activated.add(id) : state.claimed.add(id));
    toast('3 benefits claimed', '₹449 added to your account.');
    render(false); burst(document.querySelector('.hero--success'));
  }
  else if (a === 'claimScratch'){ state.claimed.add('cash100'); toast('₹100 cashback claimed','Credited to your wallet.'); render(false); }
  else if (a === 'streak'){ state.streak = Math.min(state.streak + 1, 4);
    toast(state.streak > 3 ? 'Challenge complete' : `Day ${state.streak - 1} done`, state.streak > 3 ? 'Spin & Win is unlocked below.' : 'Come back tomorrow to keep the streak.');
    render(); }
  else if (a === 'jump'){
    const sec = document.querySelector(`[data-flip="${t.dataset.to}"]`);
    sec ? sec.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'}) : toast(t.dataset.msg);
  }
  else if (a === 'scrollEarn') document.querySelector('[data-flip="earn"]')?.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!appEl.hidden) closeApp(); else if (!pageEl.hidden) closeProduct();
});
document.addEventListener('input', e => { if (e.target.id === 'q'){ state.q = e.target.value; render(false); } });
$('#cohort').addEventListener('change', e => {
  state.cohort = e.target.value; state.filter = 'all'; state.q = '';
  render(true);
  const b = reduce ? 'auto' : 'smooth';
  screenEl.scrollTo({top:0, behavior:b}); window.scrollTo({top:0, behavior:b});
});
const screenEl = $('#screen');
const scrolled = () => screenEl.scrollTop || scrollY;
const onScroll = () => $('#head').classList.toggle('is-stuck', scrolled() > 8);
addEventListener('scroll', onScroll, {passive:true});
screenEl.addEventListener('scroll', onScroll, {passive:true});
addEventListener('resize', () => { if (!state.scratch.open) initScratch(); });

$('#headActs').innerHTML = `
  <button class="hdrbtn" data-act="jump" data-to="extras" data-msg="Coins wallet — 2,450 coins available.">
    <span class="hdrbtn__c">${art('coin',24)}</span><span class="hdrbtn__l">Coins</span></button>
  <button class="hdrbtn" data-act="jump" data-to="benefits" data-msg="No benefits to show on this page.">
    <span class="hdrbtn__c"><span class="hdrbtn__b" id="hBadge"></span>${art('voucher',24)}</span>
    <span class="hdrbtn__l">Vouchers</span></button>
  <button class="hdrbtn" data-act="jump" data-to="earn" data-msg="Spin & Win isn't running on this account today.">
    <span class="hdrbtn__c">${art('wheel',24)}</span><span class="hdrbtn__l">Spin &amp; win</span></button>`;

render(false);
</script>
</body>
