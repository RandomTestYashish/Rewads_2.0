<title>Airtel Benefits Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   TOKENS — light is the base; dark redefines tokens only.
   Neutrals are warm (red-biased) so they sit under Airtel red.
   Brand red is identity + primary action. Urgency is ember,
   a separate semantic hue, so the page never turns all-red.
   ============================================================ */
:root{
  color-scheme:light;
  --paper:#FBF7F5;
  --surface:#FFFFFF;
  --surface-2:#F5EFEC;
  --surface-3:#EDE4DF;
  --ink:#191110;
  --ink-2:#5C4F4A;
  --ink-3:#8D7C76;
  --line:#EADFD9;
  --line-2:#DCCEC7;

  --red:#E30613;
  --red-deep:#C10510;
  --red-ink:#B00512;
  --red-wash:#FDECEC;

  --ember:#D4530F;
  --ember-ink:#B14409;
  --ember-wash:#FCEDE3;
  --green:#0E7A55;
  --green-ink:#0B6446;
  --green-wash:#E3F2EB;
  --amber-wash:#FBF1DA;

  --plum:#2A0B10;
  --plum-2:#3D1219;
  --gold:#C79141;
  --gold-soft:#E7C68C;

  --shadow-1:0 1px 2px rgba(60,30,25,.06);
  --shadow-2:0 6px 18px -8px rgba(60,30,25,.20), 0 1px 2px rgba(60,30,25,.05);
  --shadow-3:0 20px 44px -20px rgba(90,20,20,.34), 0 2px 6px rgba(60,30,25,.07);

  --r-s:8px; --r-m:14px; --r-l:22px; --r-pill:999px;

  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --gut:18px;
  --desk:#E7DFDA;
  --chrome:#181110;
  --chrome-ink:#F2E8E4;
  --chrome-ink-2:#A2908A;
  --chrome-line:#3A2A27;
  --chrome-field:#241A18;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#141010;
    --surface:#1D1817;
    --surface-2:#251E1C;
    --surface-3:#302825;
    --ink:#F7F0ED;
    --ink-2:#C5B5AF;
    --ink-3:#93807A;
    --line:#332927;
    --line-2:#453936;
    --red:#F0323D;
    --red-deep:#FF4A54;
    --red-ink:#FF8080;
    --red-wash:#33181A;
    --ember:#E8722F;
    --ember-ink:#FF9C63;
    --ember-wash:#331F16;
    --green:#28A277;
    --green-ink:#5FCBA1;
    --green-wash:#132A22;
    --amber-wash:#2E2415;
    --plum:#20080C;
    --plum-2:#341015;
    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --shadow-2:0 6px 18px -8px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.4);
    --shadow-3:0 20px 44px -20px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.4);
    --desk:#0B0908;
    --chrome:#0E0A09;
    --chrome-field:#1E1615;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#141010;
  --surface:#1D1817;
  --surface-2:#251E1C;
  --surface-3:#302825;
  --ink:#F7F0ED;
  --ink-2:#C5B5AF;
  --ink-3:#93807A;
  --line:#332927;
  --line-2:#453936;
  --red:#F0323D;
  --red-deep:#FF4A54;
  --red-ink:#FF8080;
  --red-wash:#33181A;
  --ember:#E8722F;
  --ember-ink:#FF9C63;
  --ember-wash:#331F16;
  --green:#28A277;
  --green-ink:#5FCBA1;
  --green-wash:#132A22;
  --amber-wash:#2E2415;
  --plum:#20080C;
  --plum-2:#341015;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 6px 18px -8px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.4);
  --shadow-3:0 20px 44px -20px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.4);
  --desk:#0B0908;
  --chrome:#0E0A09;
  --chrome-field:#1E1615;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance;font-family:var(--f-display);letter-spacing:-.02em;line-height:1.05}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img,svg{max-width:100%}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rupee{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* ---------- stage ----------
   The product IS a 375px phone. Below 900px it fills the screen; above,
   it sits in a device frame with the preview control beside it — the
   demo chrome never shares space with the product.
   ------------------------------------------------------------------ */
.stage{display:block}
.device{position:relative;background:var(--paper)}
.screen{container-type:inline-size}
.statusbar,.homebar{display:none}

.chrome{position:sticky;top:0;z-index:60;background:var(--chrome);color:var(--chrome-ink);
  border-bottom:1px solid var(--chrome-line)}
.chrome__in{padding:9px var(--gut);display:flex;align-items:center;gap:10px}
.chrome__label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--chrome-ink-2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.chrome__dot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(227,6,19,.22);flex:none}
.chrome__field{position:relative;display:flex;align-items:center;flex:1;min-width:0}
.chrome__field svg{position:absolute;right:11px;pointer-events:none;color:var(--chrome-ink-2)}
.chrome select{appearance:none;width:100%;background:var(--chrome-field);color:var(--chrome-ink);
  border:1px solid var(--chrome-line);border-radius:var(--r-pill);padding:7px 30px 7px 13px;
  font-size:12.5px;font-weight:600;min-height:36px;text-overflow:ellipsis}
.chrome select:hover{border-color:#54403c}
.chrome__note,.chrome__hints,.chrome__cap{display:none}

@media (min-width:900px){
  body{background:var(--desk)}
  .stage{display:flex;align-items:flex-start;justify-content:center;gap:clamp(28px,5vw,64px);
    padding:44px 32px 56px;min-height:100vh}
  /* preview control becomes a quiet side panel, not a bar over the app */
  .chrome{position:sticky;top:44px;width:296px;flex:none;background:none;border:0;color:var(--ink);z-index:1}
  .chrome__in{display:block;padding:0}
  .chrome__label{color:var(--ink-3);margin-bottom:16px;font-size:10px}
  .chrome__field{display:block}
  .chrome__field svg{color:var(--ink-3);top:50%;margin-top:-6px}
  .chrome select{background:var(--surface);color:var(--ink);border-color:var(--line-2);
    border-radius:var(--r-m);padding:11px 34px 11px 14px;font-size:14px;min-height:46px;box-shadow:var(--shadow-1)}
  .chrome__note{display:block;margin-top:14px;font-size:13px;line-height:1.55;color:var(--ink-2)}
  .chrome__note b{color:var(--ink);font-weight:700}
  .chrome__hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2)}
  .chrome__hints span{font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-3);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:4px 9px}
  .chrome__cap{display:block;margin-top:14px;font-size:11.5px;color:var(--ink-3);line-height:1.5}

  .device{width:375px;flex:none;display:flex;flex-direction:column;overflow:hidden;
    height:min(812px,calc(100vh - 108px));border-radius:44px;border:9px solid #17100F;
    box-shadow:0 40px 80px -32px rgba(60,25,20,.45),0 0 0 1px rgba(0,0,0,.35)}
  .screen{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:11px 24px 5px;
    font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink);background:var(--paper);flex:none}
  .statusbar__r{display:flex;align-items:center;gap:5px}
  .batt{width:20px;height:10px;border:1.4px solid var(--ink);border-radius:3px;position:relative;opacity:.85}
  .batt::before{content:"";position:absolute;inset:1.5px;right:6px;background:var(--ink);border-radius:1px}
  .batt::after{content:"";position:absolute;right:-3.4px;top:3px;width:2px;height:4px;background:var(--ink);border-radius:0 1px 1px 0}
  .homebar{display:block;flex:none;padding:7px 0 9px;background:var(--paper)}
  .homebar i{display:block;width:128px;height:5px;border-radius:3px;background:var(--ink);opacity:.28;margin:0 auto}
  .scrim{position:absolute}
  .toasts{position:absolute;left:14px;right:14px;bottom:24px;width:auto;max-width:none;transform:none}
}

/* ---------- product header ---------- */
.head{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s,background .2s}
.head.is-stuck{border-bottom-color:var(--line)}
.head__in{padding:11px var(--gut);display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.015em;font-size:16px}
.brand__mark{width:26px;height:26px;border-radius:50%;background:var(--red);position:relative;flex:none}
.brand__mark::after{content:"";position:absolute;inset:7px 5px 5px 7px;border-left:3.5px solid #fff;
  border-bottom:3.5px solid #fff;border-bottom-left-radius:12px;transform:rotate(-45deg)}
.brand__sep{width:1px;height:17px;background:var(--line-2)}
.brand__page{font-weight:600;color:var(--ink-2);font-size:15px}
.head__acts{margin-left:auto;display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);
  transition:background .15s,color .15s}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(150deg,var(--red),#7C0410);
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.02em}

/* ---------- layout ---------- */
.wrap{padding:0 var(--gut) 72px}
.stack{display:flex;flex-direction:column;gap:clamp(26px,7cqw,34px)}
.sec{display:flex;flex-direction:column;gap:14px}
.sec__head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec__title{font-size:19px;font-weight:700;letter-spacing:-.02em}
.sec__sub{font-size:13px;color:var(--ink-3);margin-top:3px}
.sec__link{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;
  display:flex;align-items:center;gap:4px}
.sec__link:hover{color:var(--red)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow--ember{color:var(--ember-ink)}

/* ============================================================
   HERO — seven distinct compositions, one per cohort state.
   Not a shared shell with swapped copy: different geometry,
   different surface, different supporting instrument.
   ============================================================ */
.hero{padding:26px 0 4px}
.hero__eyebrow{margin-bottom:12px}

/* default: earnings ledger */
.hero--default .hero__grid{display:grid;gap:20px}
.hero__amount{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display);font-weight:800;
  letter-spacing:-.045em;font-size:clamp(3.1rem,15cqw,3.9rem);line-height:.86}
.hero__amount .cur{font-size:.5em;font-weight:700;letter-spacing:-.02em;transform:translateY(-.1em)}
.hero__lede{font-size:clamp(1.02rem,4.6cqw,1.18rem);font-weight:600;letter-spacing:-.015em;margin-top:14px;max-width:22ch}
.hero__meta{font-size:13.5px;color:var(--ink-2);margin-top:7px}
.hero__ledger{border-top:1px solid var(--line-2);display:flex;flex-direction:column}
.led{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.led__t{font-size:14px;font-weight:600}
.led__s{font-size:11.5px;color:var(--ink-3)}
.led__v{margin-left:auto;font-family:var(--f-mono);font-size:13px;font-weight:600}
.led__dot{width:7px;height:7px;border-radius:50%;flex:none}

/* welcome: streak */
.hero--welcome .hero__panel{background:linear-gradient(168deg,var(--surface),var(--amber-wash));
  border:1px solid var(--line);border-radius:var(--r-l);padding:26px 22px;box-shadow:var(--shadow-2)}
.hero--welcome h1{font-size:clamp(1.85rem,8.2cqw,2.3rem)}
.streak{display:flex;gap:10px;margin-top:20px}
.streak__day{flex:1;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);
  padding:12px 8px;text-align:center;position:relative;overflow:hidden}
.streak__day.is-done{border-color:transparent;background:var(--green);color:#fff}
.streak__day.is-today{border:1.5px dashed var(--red);background:var(--red-wash)}
.streak__n{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.streak__mark{font-size:20px;font-weight:700;line-height:1.2;font-family:var(--f-display)}
.streak__day.is-today .streak__mark{color:var(--red-ink)}

/* premium: plum */
.hero--premium .hero__panel{background:linear-gradient(150deg,var(--plum-2),var(--plum));color:#F6EBE3;
  border-radius:var(--r-l);padding:clamp(22px,6cqw,26px);box-shadow:var(--shadow-3);
  border:1px solid rgba(199,145,65,.28);position:relative;overflow:hidden}
.hero--premium .hero__panel::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;
  border-radius:50%;background:radial-gradient(circle,rgba(199,145,65,.30),transparent 68%)}
.hero--premium h1{font-size:clamp(1.65rem,7cqw,2rem);max-width:16ch}
.hero--premium .hero__meta{color:#D9C4B8}
.tier{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(231,198,140,.4);
  border-radius:var(--r-pill);padding:5px 12px;font-family:var(--f-mono);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:16px}
.tier__gem{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.prem__row{display:grid;gap:14px;grid-template-columns:repeat(3,1fr);margin-top:26px;
  border-top:1px solid rgba(231,198,140,.22);padding-top:18px;position:relative}
.prem__v{font-family:var(--f-display);font-size:clamp(1.02rem,4.6cqw,1.25rem);font-weight:700;letter-spacing:-.03em}
.prem__l{font-size:11px;color:#C9AFA3;margin-top:2px}

/* urgent: countdown */
.hero--urgent .hero__panel{display:grid;gap:18px;justify-items:center;text-align:center;
  background:var(--surface);border:1px solid var(--ember);border-radius:var(--r-l);
  padding:24px 20px;box-shadow:0 18px 40px -22px rgba(212,83,15,.55)}
.hero--urgent .hero__panel .btn{justify-self:center}
.ring{width:132px;height:132px;position:relative;flex:none;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring__mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring__n{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1}
.ring__l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ember-ink);margin-top:4px}
.hero--urgent h1{font-size:clamp(1.6rem,6.8cqw,1.95rem)}

/* success: recharge receipt */
.hero--success .hero__panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--shadow-2);overflow:hidden}
.receipt{display:flex;align-items:center;gap:14px;padding:18px 22px;background:var(--green-wash);
  border-bottom:1px dashed var(--line-2)}
.receipt__tick{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.receipt__t{font-weight:700;letter-spacing:-.01em}
.receipt__s{font-family:var(--f-mono);font-size:11.5px;color:var(--green-ink);margin-top:2px}
.unlocked{padding:22px}
.unlocked h1{font-size:clamp(1.5rem,6.6cqw,1.85rem)}
.rail{display:flex;gap:10px;overflow-x:auto;padding:16px 2px 4px;margin:0 -2px;scroll-snap-type:x mandatory;
  scrollbar-width:thin}
.rail>*{scroll-snap-align:start}

/* lowdata: meter */
.hero--lowdata .hero__panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  padding:24px 22px;box-shadow:var(--shadow-2)}
.meter{margin-top:20px}
.meter__bar{height:12px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden;position:relative}
.meter__fill{height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--ember),#EE8B3D);
  width:4%;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.meter__row{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--f-mono);
  font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.meter__row b{color:var(--ember-ink);font-weight:600}

/* action: hellotune waveform */
.hero--action .hero__panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  padding:24px 22px;box-shadow:var(--shadow-2);position:relative;overflow:hidden}
.wave{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:20px}
.wave i{flex:1;background:linear-gradient(180deg,var(--red),#F2837F);border-radius:2px;opacity:.85;
  animation:wv 1.5s ease-in-out infinite alternate}
@keyframes wv{from{height:16%}to{height:100%}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;
  border-radius:var(--r-pill);font-weight:650;font-size:14.5px;letter-spacing:-.005em;
  transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .18s,background .15s,border-color .15s;
  border:1px solid transparent;white-space:nowrap}
.btn:active{transform:translateY(1px) scale(.99)}
.btn--primary{background:var(--red);color:#fff;box-shadow:0 6px 16px -8px rgba(227,6,19,.85)}
.btn--primary:hover{background:var(--red-deep);box-shadow:0 10px 22px -9px rgba(227,6,19,.9)}
.btn--ember{background:var(--ember);color:#fff;box-shadow:0 6px 16px -8px rgba(212,83,15,.85)}
.btn--ember:hover{filter:brightness(1.06)}
.btn--ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn--ghost:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn--quiet{background:transparent;color:var(--ink-2);padding:0 12px;min-height:38px;font-size:13.5px}
.btn--quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn--gold{background:var(--gold);color:#231007;box-shadow:0 6px 16px -9px rgba(199,145,65,.9)}
.btn--gold:hover{filter:brightness(1.06)}
.btn--sm{min-height:36px;font-size:13.5px;padding:0 14px}
.btn--wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:3px 9px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.chip--new{background:var(--red);color:#fff}
.chip--urgent{background:var(--ember-wash);color:var(--ember-ink)}
.chip--active{background:var(--green-wash);color:var(--green-ink)}
.chip--muted{background:var(--surface-2);color:var(--ink-3)}
.chip--gold{background:rgba(199,145,65,.16);color:var(--gold)}

/* ---------- benefit cards: three weights, set by priority score ---------- */
.grid{display:grid;gap:11px;grid-template-columns:1fr}

.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:16px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow-1);
  transition:box-shadow .2s,border-color .2s,transform .2s}
.card:hover{box-shadow:var(--shadow-2)}
.card__top{display:flex;align-items:flex-start;gap:10px}
.card__ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:var(--surface-2);color:var(--ink-2)}
.card__ico--cash{background:var(--green-wash);color:var(--green-ink)}

/* ============================== priorityEngine.ts ==========================
   priorityScore = urgency · recency · userRelevance · rewardValue · engagement
   Every factor is normalised 0–1, then weighted by the cohort. The score does
   two jobs: it ORDERS the benefits, and it sets each card's VISUAL WEIGHT
   (featured → standard → quiet), so prioritisation is visible, not just sorted.
   ========================================================================== */
const clamp01 = n => Math.max(0, Math.min(1, n));

function score(b, cfg){
  // Spent or lapsed benefits never compete for attention.
  if (b.state === 'used' || b.state === 'expired') return 0.04;

  // 1. Urgency — a 14-day runway; today = 1, anything further out decays fast.
  const urgency  = b.exp === null ? 0 : clamp01(1 - b.exp / 14);
  // 2. Recency — just-earned beats long-held, and unclaimed beats already-on.
  const recency  = b.isNew ? 1 : (b.state === 'ready' ? .5 : .2);
  // 3. Relevance — tag overlap with what this cohort actually cares about.
  const hits     = b.tags.filter(t => cfg.relevant.includes(t)).length;
  const relevance= clamp01(hits / 1.5);
  // 4. Value — ₹ worth, flattened so one big voucher can't own the page.
  const value    = clamp01(Math.sqrt(b.value) / 39);
  // 5. Engagement opportunity — something still to unlock is a hook.
  const engage   = b.state === 'locked' ? .95 : .2;

  const w = cfg.weights;
  return urgency*w.urgency + recency*w.recency + relevance*w.relevance
       + value*w.value + engage*w.engage;
}

function rank(ids, cfg){
  return ids.map(id => ({...B[id], _s: score(B[id], cfg)}))
            .sort((a, b) => b._s - a._s);
}
// Visual weight bands. Only ONE card is ever allowed to be featured.
function weightOf(b, i, top){
  if (b.state === 'used' || b.state === 'expired') return 'past';
  if (i === 0 && b._s >= .5 && b._s === top) return 'featured';
  if (b._s < .3) return 'quiet';
  return 'standard';
}

/* live status: claiming/activating in this session rewrites the card state */
function view(b){
  const o = {...b};
  if (state.claimed.has(b.id))   { o.state='used';   o.why='Claimed just now · added to your account'; o.cta=null; o.exp=null; o.isNew=false; }
  if (state.activated.has(b.id)) { o.state='active'; o.why='Activated just now · ready to use'; o.cta='Open'; }
  return o;
}
function expiryLabel(b){
  if (b.exp === null || b.state==='used' || b.state==='expired') return '';
  if (b.exp <= 0) return 'Expires today';
  if (b.exp === 1) return 'Expires tomorrow';
  if (b.exp <= 14) return `Expires in ${b.exp} days`;
  return `Valid till ${new Date(2026, 8, 10 + b.exp).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}`;
}
const STATUS = {
  ready:   b => ['Ready to claim','ready'],
  active:  b => ['Active','active'],
  locked:  b => ['Not unlocked yet','locked'],
  used:    b => ['Used','past'],
  expired: b => ['Expired','past']
};

/* ============================= BenefitCard ================================= */
function BenefitCard(raw, weight){
  const b = raw, hot = b.exp !== null && b.exp <= 2 && (b.state==='ready'||b.state==='active');
  const [stxt, skey] = (STATUS[b.state] || STATUS.ready)(b);
  const status = hot && b.state !== 'locked' ? ['Expiring','expiring'] : [stxt, skey];
  const tone = b.state==='locked' ? 'tone-red' : (hot ? '' : 'tone-green');
  const exp = expiryLabel(b);
  const btnKind = weight==='featured' ? (hot ? 'btn--ember' : 'btn--primary')
                : b.state==='locked' ? 'btn--ghost' : (hot ? 'btn--ember' : 'btn--ghost');

  if (weight === 'quiet' || weight === 'past'){
    return el(`<article class="card card--quiet ${weight==='past'?'card--past':''}" data-flip="b-${b.id}">
      <span class="card__ico card__ico--${b.type}">${ico(b.type==='cash'?'cash':b.type==='ott'?'ott':b.type==='voucher'?'voucher':b.type==='insider'?'insider':b.type==='game'?'game':'plan',16)}</span>

      </div>
    </article>`);
  }

  return el(`<article class="card ${weight==='featured'?'card--featured '+tone:''}" data-flip="b-${b.id}">
    <div class="card__top">
      <span class="card__ico card__ico--${b.type}">${ico(b.type==='cash'?'cash':b.type==='ott'?'ott':b.type==='voucher'?'voucher':b.type==='insider'?'insider':b.type==='game'?'game':'plan', weight==='featured'?21:18)}</span>

      ${exp ? `<span class="expiry ${hot?'expiry--hot':''}">${exp}</span>` : ''}
    </div>
    ${b.cta ? `<button class="btn ${btnKind} ${weight==='featured'?'':'btn--sm'}" data-act="open" data-id="${b.id}">
        ${esc(b.cta)} ${weight==='featured'?ico('arrow',17,2.2):''}</button>` : ''}
  </article>`);
}

function totals(cfg){
  const list = cfg.ids.map(id => view(B[id]));
  const own  = list.filter(b => b.state==='ready' || b.state==='active');
  return {
    value: own.reduce((n,b)=>n+b.value,0),
    ready: list.filter(b=>b.state==='ready').length,
    soon:  list.filter(b=>b.exp!==null && b.exp<=2 && b.state!=='used' && b.state!=='expired').length,
    locked:list.filter(b=>b.state==='locked').length
  };
}

    const wrap = el(`<section class="sec" data-flip="recommend">
      <div class="sec__head"><div>
        <h2 class="sec__title">${esc(cfg.copy?.recommend || 'Recommended for you')}</h2>
        <p class="sec__sub">Based on how you've used Airtel in the last 30 days</p>
      </div></div>
      <div class="grid"></div></section>`);
    const g = wrap.querySelector('.grid');
    g.appendChild(BenefitCard(primary,'featured'));
    if (extra) g.appendChild(BenefitCard(extra,'standard'));
    inAttention = new Set([primary.id, extra?.id].filter(Boolean));
    return wrap;
  },

  /* FilterBar + BenefitGrid */
  benefits(cfg){
    const filtering = state.filter !== 'all' || state.q.trim() !== '';
    const all = rank(cfg.ids,cfg).map(view);
    const counts = {
      all: all.length,
      ready: all.filter(b=>b.state==='ready').length,
      active: all.filter(b=>b.state==='active').length,
      expiring: all.filter(b=>b.exp!==null&&b.exp<=2&&(b.state==='ready'||b.state==='active')).length,
      past: all.filter(b=>b.state==='used'||b.state==='expired').length
    };
    const q = state.q.trim().toLowerCase();
    let list = all.filter(b=>{
      if (!filtering && inAttention.has(b.id)) return false;   // no duplicate of the priority row
      if (b.state === 'locked' && b.type === 'game') return false; // lives in Earn more
      if (q && !(b.title+' '+b.why).toLowerCase().includes(q)) return false;
      if (state.filter==='ready')    return b.state==='ready';
      if (state.filter==='active')   return b.state==='active';
      if (state.filter==='expiring') return b.exp!==null && b.exp<=2 && (b.state==='ready'||b.state==='active');
      if (state.filter==='past')     return b.state==='used' || b.state==='expired';
      return true;
    });
    const tab = (k,l,n) => `<button class="tab" role="tab" data-filter="${k}" aria-selected="${state.filter===k}">${l}<span class="tab__n">${n}</span></button>`;
    const wrap = el(`<section class="sec" data-flip="benefits">
      <div class="sec__head"><div>
        <h2 class="sec__title">${esc(cfg.copy?.benefits || 'Your benefits')}</h2>
        <p class="sec__sub">${esc(cfg.copy?.benefitsSub || 'Everything you hold right now, in one place')}</p>
      </div></div>
      <div class="filters">
        <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          <input id="q" type="search" placeholder="Search benefits" value="${esc(state.q)}" aria-label="Search benefits"></div>
        <div class="tabs" role="tablist" aria-label="Filter benefits">
          ${tab('all','All',counts.all)}${tab('ready','Ready to use',counts.ready)}${tab('active','Active',counts.active)}${tab('expiring','Expiring',counts.expiring)}${tab('past','Used &amp; expired',counts.past)}
        </div>
      </div>
      <div class="grid"></div></section>`);
    const g = wrap.querySelector('.grid');
    if (!list.length){
      g.appendChild(el(`<div class="empty" style="grid-column:1/-1">Nothing here${q?` for “${esc(state.q)}”`:''}. Try “All”.</div>`));
    } else {
      const best = list[0]._s;
      list.forEach((b,i)=>{
        // inside the catalogue, never promote to featured — the priority row owns that weight
        const w = weightOf(b,i,best);
        g.appendChild(BenefitCard(b, w==='featured' ? 'standard' : w));
      });
    }
    return wrap;
  },

  /* GamifiedReward: ScratchCard + SpinWheel, one module, same product */
  earn(cfg){
    const locked = state.streak <= 3 && state.cohort==='dormant';
    const segs = [
      {l:'₹10 cashback', c:'#E30613'},{l:'50 MB data', c:'#2A0B10'},
      {l:'₹100 voucher', c:'#D4530F'},{l:'Better luck', c:'#5C4F4A'},
      {l:'1 GB data',    c:'#0E7A55'},{l:'₹25 cashback', c:'#B0121F'}
    ];
    const step = 360/segs.length;
    const grad = segs.map((s,i)=>`${s.c} ${i*step}deg ${(i+1)*step}deg`).join(',');
    const labels = segs.map((s,i)=>`<span class="wheel__lbl" style="transform:rotate(${i*step+step/2-90}deg) translate(28px,-4px)">${s.l}</span>`).join('');

    const wrap = el(`<section class="sec" data-flip="earn">
      <div class="sec__head"><div>
        <h2 class="sec__title">Earn more</h2>
        <p class="sec__sub">Complete a task. Unlock a reward.</p>
      </div><button class="sec__link" data-act="toast" data-msg="All challenges refresh at midnight.">All challenges ${ico('arrow',14,2.4)}</button></div>
      <div class="play">
        <div class="play__card">
          <div class="play__head"><span class="card__ico card__ico--voucher">${ico('sparkle',17)}</span>
            <div><div class="play__t">Today's scratch card</div><div class="play__s">${state.scratch.open?'Revealed — claim it below':'Earned with your last recharge'}</div></div></div>
          <div class="scratch ${state.scratch.open?'is-open':''}" id="scratch">
            <div class="scratch__prize"><div class="scratch__amt">₹100</div><div class="scratch__lbl">Cashback won</div></div>
            <canvas id="scratchCanvas"></canvas>
            <span class="scratch__hint">Scratch to reveal</span>
          </div>
          <button class="btn ${state.scratch.open?'btn--primary':'btn--ghost'} btn--wide" ${state.scratch.open?'':'disabled'} data-act="claimScratch">
            ${state.scratch.open?'Redeem ₹100 now':'Scratch the card first'}</button>
        </div>
        <div class="play__card">
          <div class="play__head"><span class="card__ico card__ico--ott">${ico('game',17)}</span>
            <div><div class="play__t">Spin &amp; Win</div><div class="play__s">${locked?'Unlocks on day 3 of your challenge':'One free spin today'}</div></div></div>
          <div class="wheel-wrap">
            <div class="wheel-outer">
              <span class="wheel__pin"></span>
              <div class="wheel" id="wheel" style="background:conic-gradient(${grad});transform:rotate(${state.spin.angle}deg)">${labels}</div>
              <span class="wheel__hub">SPIN</span>
            </div>
            <p class="wheel__out" id="spinOut">${state.spin.result?`You won <b>${state.spin.result}</b>`:'Land the pointer on a prize'}</p>
          </div>
          <button class="btn ${locked?'btn--ghost':'btn--primary'} btn--wide" ${locked||state.spin.result?'disabled':''} data-act="spin">
            ${locked?'Locked':state.spin.result?'Come back tomorrow':'Play now'}</button>
        </div>
      </div></section>`);
    return wrap;
  },

  /* CoinsCard + SubscriptionsCard */
  extras(cfg){
    return el(`<section class="sec" data-flip="extras">
      <div class="sec__head"><div><h2 class="sec__title">Your Airtel extras</h2>
        <p class="sec__sub">Coins and subscriptions, without leaving this page</p></div></div>
      <div class="extras">
        <div class="xcard xcard--coins">
          <span class="coinstack">${ico('coin',120,1.2)}</span>
          <span class="chip chip--gold">${ico('coin',12,2.2)} Airtel Coins</span>
          <div class="xcard__v mono">2,450</div>
          <p class="xcard__s">You've saved ${money(245)} with coins so far. 400 coins expire on 30 Sep.</p>
          <button class="btn btn--sm btn--ghost" data-act="toast" data-msg="Coins wallet — 2,450 coins available.">View coins</button>
        </div>
        <div class="xcard">
          <span class="chip chip--muted">${ico('sub',12,2.2)} Subscriptions</span>
          <div class="xcard__v">3 active</div>
          <p class="xcard__s">Netflix, Xstream Play and Wynk — all billed with your Airtel plan.</p>
          <div class="subrow">${SUBS.map(s=>`<span class="sublogo" style="background:${s.c}" title="${s.n}">${s.n[0]}</span>`).join('')}</div>
          <button class="btn btn--sm btn--ghost" data-act="toast" data-msg="Subscriptions — 3 active, next bill 28 Sep.">Manage subscriptions</button>
        </div>
      </div></section>`);
  },

  /* ActivitySection */
  activity(cfg){
    const rows = ACTIVITY.map(a=>`<div class="act__row">
      <span class="act__mark" style="background:${a.k==='ok'?'var(--green-wash)':'var(--surface-2)'};color:${a.k==='ok'?'var(--green-ink)':'var(--ink-3)'}">${ico(a.k==='ok'?'tick':'clock',13,2.6)}</span>
      <span><span class="act__t">${a.t}</span><br><span class="act__s">${a.s}</span></span>
      <span class="act__v">${a.v}</span></div>`).join('');
    return el(`<section class="sec" data-flip="activity">
      <div class="sec__head"><div><h2 class="sec__title">Your activity</h2>
        <p class="sec__sub">Claimed, used and expired — last 30 days</p></div>
        <button class="sec__link" data-act="toast" data-msg="Full benefits history opened.">View history ${ico('arrow',14,2.4)}</button></div>
      <div class="act">${rows}</div></section>`);
  }
};

/* =============================== renderer ================================== */
const stack = $('#stack');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function render(animate = true){
  const cfg = COHORTS[state.cohort];
  cfg.id = state.cohort;
  const before = new Map();
  if (animate && !reduce) stack.querySelectorAll('[data-flip]').forEach(n => before.set(n.dataset.flip, n.getBoundingClientRect()));

  const focused = document.activeElement?.id === 'q';
  const caret = focused ? $('#q').selectionStart : null;

  inAttention = new Set();
  stack.innerHTML = '';
  cfg.sections.forEach((id, i) => {
    const node = SECTIONS[id](cfg);
    node.style.animationDelay = (animate && !reduce) ? `${i * 45}ms` : '0ms';
    stack.appendChild(node);
  });

  // FLIP: sections that survive the cohort change slide to their new slot
  if (animate && !reduce){
    stack.querySelectorAll('[data-flip]').forEach(n => {
      const b = before.get(n.dataset.flip); if (!b) return;
      const a = n.getBoundingClientRect();
      const dy = b.top - a.top, dx = b.left - a.left;
      if (Math.abs(dy) < 2 && Math.abs(dx) < 2) return;
      n.style.animation = 'none';
      n.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],
                {duration:460, easing:'cubic-bezier(.2,.85,.2,1)'});
    });
  }

  if (focused){ const q = $('#q'); q.focus(); q.setSelectionRange(caret, caret); }
  initScratch();
  if (state.cohort === 'data') requestAnimationFrame(()=>{ const m = $('#meterFill'); if (m) m.style.width = '4%'; });
  $('#chromeNote').innerHTML = `<b>${esc(cfg.label)}.</b> ${esc(cfg.note)}`;
}

/* ============================== ScratchCard ================================ */
function initScratch(){
  const box = $('#scratch'), cv = $('#scratchCanvas');
  if (!cv || state.scratch.open) return;
  const r = box.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  const g = c.createLinearGradient(0, 0, r.width, r.height);
  g.addColorStop(0, '#E30613'); g.addColorStop(.55, '#A50410'); g.addColorStop(1, '#6E0209');
  c.fillStyle = g; c.fillRect(0, 0, r.width, r.height);
  c.globalCompositeOperation = 'destination-out';
  let drawing = false, cleared = 0;
  const at = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const rub = e => {
    if (!drawing) return;
    const [x, y] = at(e);
    c.beginPath(); c.arc(x, y, 22, 0, 7); c.fill();
    if (++cleared % 9 === 0 && cleared > 16) check();
  };
  const check = () => {
    const d = c.getImageData(0, 0, cv.width, cv.height).data;
    let clear = 0; for (let i = 3; i < d.length; i += 4 * 40) if (d[i] === 0) clear++;
    if (clear / (d.length / (4 * 40)) > .42) reveal();
  };
  const reveal = () => {
    state.scratch.open = true; box.classList.add('is-open');
    burst(box); toast('₹100 cashback revealed', 'Redeem it before 17 Sep.');
    render(false);
  };
  cv.addEventListener('pointerdown', e => { drawing = true; cv.setPointerCapture(e.pointerId); rub(e); });
  cv.addEventListener('pointermove', rub);
  cv.addEventListener('pointerup', () => { drawing = false; check(); });
  cv.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); } });
  cv.tabIndex = 0; cv.setAttribute('role','button'); cv.setAttribute('aria-label','Scratch card — press Enter to reveal your reward');
}

/* =============================== SpinWheel ================================= */
function spin(){
  if (state.spin.spinning || state.spin.result) return;
  const segs = ['₹10 cashback','50 MB data','₹100 voucher','Better luck','1 GB data','₹25 cashback'];
  const pick = 4;                                   // demo lands on "1 GB data"
  const step = 360 / segs.length;
  const target = 360 * 4 + (360 - (pick * step + step / 2));
  state.spin.spinning = true;
  const w = $('#wheel');
  w.style.transform = `rotate(${target}deg)`;
  const finish = () => {
    state.spin.angle = target % 360; state.spin.result = segs[pick]; state.spin.spinning = false;
    toast('You won 1 GB data', 'Added to your account instantly.');
    burst($('#wheel'));
    render(false);
  };
  reduce ? finish() : setTimeout(finish, 4300);
}

/* =============================== feedback ================================== */
function toast(title, sub){
  const t = el(`<div class="toast"><span class="toast__t">${ico('tick',12,3)}</span>
    <span><b>${esc(title)}</b>${sub ? `<br><span style="opacity:.75">${esc(sub)}</span>` : ''}</span></div>`);
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s, transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 320); }, 3400);
}
function burst(anchor){
  if (reduce || !anchor) return;
  const r = anchor.getBoundingClientRect(), layer = el('<div class="confetti"></div>');
  document.body.appendChild(layer);
  const cols = ['#E30613','#D4530F','#0E7A55','#C79141'];
  for (let i = 0; i < 22; i++){
    const p = document.createElement('i');
    p.style.cssText = `position:absolute;width:7px;height:11px;border-radius:2px;background:${cols[i%4]};
      left:${r.left + r.width/2}px;top:${r.top + r.height/2}px`;
    layer.appendChild(p);
    p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:`translate(${(Math.random()-.5)*300}px,${-120 - Math.random()*160}px) rotate(${Math.random()*540}deg)`,opacity:0}],
      {duration:900 + Math.random()*500, easing:'cubic-bezier(.15,.7,.3,1)'});
  }
  setTimeout(() => layer.remove(), 1500);
}

/* ============================== ClaimDialog ================================
   One-tap claim. No coupon code to copy unless the partner has no SSO —
   that fallback is shown only for the MakeMyTrip voucher.
   ========================================================================== */
const scrim = $('#scrim'), sheet = $('#sheet');
let lastFocus = null, current = null;

const toneOf = b => b.state==='locked' ? ['var(--red-wash)','var(--red-ink)']
  : (b.exp !== null && b.exp <= 2) ? ['var(--ember-wash)','var(--ember-ink)'] : ['var(--green-wash)','var(--green-ink)'];

function sheetConfirm(b){
  const [bg, fg] = toneOf(b);
  const action = b.state === 'locked' ? b.cta : (b.state === 'active' ? 'Open' : (b.type === 'ott' ? 'Activate now' : 'Claim benefit'));
  const terms = [
    ['What you get', b.value ? money(b.value) : 'Plan benefit'],
    ['Why you have it', b.tags.includes('recharge') ? 'Recharge reward' : b.tags.includes('premium') ? 'Airtel Black' : b.tags.includes('engagement') ? 'Engagement reward' : 'Airtel Insider'],
    ['Valid till', b.exp === null ? 'No expiry' : b.exp <= 0 ? 'Today, 11:59 PM' : new Date(2026, 8, 10 + b.exp).toLocaleDateString('en-IN', {day:'numeric', month:'short'})],
    ['Where it applies', b.to || (b.partner ? 'Partner app · signed in automatically' : 'Airtel app & website')]
  ];
  return `<div class="sheet__grab"></div>
    <div class="sheet__ico" style="background:${bg};color:${fg}">${ico(b.type==='cash'?'cash':b.type==='ott'?'ott':b.type==='voucher'?'voucher':b.type==='insider'?'insider':'plan',26,2)}</div>
    <h3 id="sheetTitle">${esc(b.title)}</h3>
    <p class="sheet__why">${esc(b.why)}</p>
    <div class="sheet__terms">${terms.map(t=>`<div class="trow"><span>${t[0]}</span><b>${esc(t[1])}</b></div>`).join('')}</div>
    <div class="sheet__acts">
      <button class="btn ${b.exp!==null&&b.exp<=2?'btn--ember':'btn--primary'} btn--wide" data-act="confirm">${esc(action)}</button>
      <button class="btn btn--quiet btn--wide" data-act="close">Not now</button>
    </div>`;
}
function sheetHandoff(b){
  return `<div class="sheet__grab"></div><div class="handoff"><div class="spinner"></div>
    <p style="font-weight:650">Taking you to ${esc(b.id==='mmt'?'MakeMyTrip':b.id==='myntra'?'Myntra':b.id==='ott599'?'Sony LIV':'the partner')}…</p>
    <p class="sheet__why" style="text-align:center;max-width:28ch">Signing you in with your Airtel number — no code to copy.</p></div>`;
}
function sheetDone(b){
  const msg = b.state==='locked'
    ? {t:'All set ✓', s: b.id==='talktime' ? 'HelloTune activated. ₹30 talktime is on its way.' : b.id==='autopay' ? 'AutoPay is on. ₹50 comes off every bill from October.' : b.id==='minidata' ? '1 GB added. It’s live on your number now.' : 'Unlocked. Your reward has been added.'}
    : {t:'Claimed ✓', s:`${b.title} has been added to your account.`};
  return `<div class="sheet__grab"></div><div class="done">
      <span class="done__tick">${ico('tick',30,2.6)}</span>
      <h3 id="sheetTitle" style="margin-top:10px">${msg.t}</h3>
      <p class="sheet__why" style="max-width:30ch">${esc(msg.s)}</p></div>
    ${b.id==='mmt' ? `<div class="sheet__terms"><div class="trow"><span>Coupon (fallback)</span><b>AIRTEL1500MMT</b></div></div>` : ''}
    <div class="sheet__acts"><button class="btn btn--ghost btn--wide" data-act="close">Done</button></div>`;
}
function openSheet(id){
  const b = view(B[id]); current = b; lastFocus = document.activeElement;
  scrim.hidden = false; sheet.innerHTML = (b.state==='used'||b.state==='expired') ? sheetDone(b) : sheetConfirm(b);
  requestAnimationFrame(()=>{ scrim.classList.add('is-open'); sheet.querySelector('.btn')?.focus(); });
}
function closeSheet(){
  scrim.classList.remove('is-open');
  setTimeout(()=>{ scrim.hidden = true; sheet.innerHTML=''; lastFocus?.focus?.(); }, 220);
}
function confirmSheet(){
  const b = current; if (!b) return;
  const finish = () => {
    if (b.state === 'locked'){
      if (b.id==='talktime') state.tasks.hellotune = true;
      state.claimed.add(b.id);
      toast('Unlocked', b.id==='minidata' ? '1 GB is live on your number.' : 'Your reward has been added.');
    } else if (b.type === 'ott' || b.state === 'active'){
      state.activated.add(b.id); toast('Activated', `${b.title} is ready to watch.`);
    } else {
      state.claimed.add(b.id); toast(`${b.title} claimed`, 'Added to your Airtel account.');
    }
    sheet.innerHTML = sheetDone(b);
    sheet.querySelector('.btn')?.focus();
    burst(sheet); render(false);
  };
  if (b.partner && b.state !== 'locked'){
    sheet.innerHTML = sheetHandoff(b);
    setTimeout(finish, reduce ? 0 : 1400);
  } else finish();
}

/* =============================== events ==================================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act], [data-filter]');
  if (!t) return;
  const a = t.dataset.act;
  if (t.dataset.filter){ state.filter = t.dataset.filter; render(false); return; }
  if (a === 'open')        openSheet(t.dataset.id);
  else if (a === 'close')  closeSheet();
  else if (a === 'confirm')confirmSheet();
  else if (a === 'spin')   spin();
  else if (a === 'toast')  toast(t.dataset.msg);
  else if (a === 'claimScratch'){ state.claimed.add('cash100'); toast('₹100 cashback claimed','Credited to Airtel Payments Bank.'); render(false); }
  else if (a === 'streak'){ state.streak = Math.min(state.streak + 1, 4);
    toast(state.streak > 3 ? 'Challenge complete' : `Day ${state.streak - 1} done`, state.streak > 3 ? 'Spin & Win is unlocked below.' : 'Come back tomorrow to keep the streak.');
    render(); }
  else if (a === 'scrollEarn') document.querySelector('[data-flip="earn"]')?.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
});
scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !scrim.hidden) closeSheet(); });
document.addEventListener('input', e => { if (e.target.id === 'q'){ state.q = e.target.value; render(false); } });
$('#cohort').addEventListener('change', e => {
  state.cohort = e.target.value; state.filter = 'all'; state.q = '';
  render(true);
  const b = reduce ? 'auto' : 'smooth';
  screenEl.scrollTo({top:0, behavior:b}); window.scrollTo({top:0, behavior:b});
});
$('#searchJump').addEventListener('click', () => {
  document.querySelector('[data-flip="benefits"]')?.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
  setTimeout(() => $('#q')?.focus(), reduce ? 0 : 380);
});
const screenEl = $('#screen');
const scrolled = () => screenEl.scrollTop || scrollY;
const onScroll = () => $('#head').classList.toggle('is-stuck', scrolled() > 8);
addEventListener('scroll', onScroll, {passive:true});
screenEl.addEventListener('scroll', onScroll, {passive:true});
addEventListener('resize', () => { if (!state.scratch.open) initScratch(); });

render(false);
</script>
